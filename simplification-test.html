<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simplification Mock Test - Exam Prep Hub</title>
  <style>
    :root {
      --primary: #1e40af;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --success: #16a34a;
      --success-bg: #f0fdf4;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 680px;
      margin: auto;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px;
      border: 1px solid var(--border);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 2px solid var(--border);
      padding-bottom: 14px;
    }

    .title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--primary);
    }

    .timer-badge {
      font-size: 0.95rem;
      font-weight: 700;
      background: #eff6ff;
      color: var(--primary);
      padding: 6px 14px;
      border-radius: 9999px;
      border: 1px solid #bfdbfe;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .timer-warning {
      background: var(--danger-bg);
      color: var(--danger);
      border-color: #fecaca;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    .progress-info {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background-color: var(--border);
      border-radius: 9999px;
      overflow: hidden;
      margin-bottom: 24px;
    }

    .progress-bar-fill {
      height: 100%;
      background-color: var(--primary);
      width: 0%;
      transition: width 0.3s ease;
    }

    .question-text {
      font-size: 1.15rem;
      font-weight: 600;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .option-btn {
      background: #ffffff;
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 1rem;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      transition: all 0.2s ease;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }

    .option-btn:hover {
      border-color: #93c5fd;
      background-color: #f0f7ff;
    }

    .option-btn.selected {
      border-color: var(--primary);
      background-color: #eff6ff;
      font-weight: 600;
    }

    .option-prefix {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #f1f5f9;
      font-size: 0.85rem;
      font-weight: 700;
      flex-shrink: 0;
      color: var(--text-muted);
    }

    .option-btn.selected .option-prefix {
      background: var(--primary);
      color: #ffffff;
    }

    .btn {
      width: 100%;
      padding: 14px 20px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-primary {
      background-color: var(--primary);
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      background-color: var(--primary-hover);
    }

    .btn-primary:disabled {
      background-color: #cbd5e1;
      cursor: not-allowed;
    }

    .btn-secondary {
      background-color: transparent;
      color: var(--primary);
      border: 2px solid var(--primary);
      margin-top: 10px;
    }

    .btn-secondary:hover {
      background-color: var(--bg);
    }

    .results-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .results-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 8px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      text-align: center;
    }

    .stat-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 4px;
    }

    .stat-val {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--text);
    }

    .review-heading {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }

    .review-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 24px;
    }

    .review-item {
      padding: 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .review-item.correct {
      background-color: var(--success-bg);
      border-color: #bbf7d0;
    }

    .review-item.wrong {
      background-color: var(--danger-bg);
      border-color: #fecaca;
    }

    .review-q-text {
      font-weight: 600;
      margin-bottom: 10px;
      font-size: 0.95rem;
    }

    .review-ans-row {
      font-size: 0.88rem;
      margin-bottom: 4px;
    }

    .review-explanation {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed rgba(0, 0, 0, 0.1);
      font-size: 0.85rem;
      color: #334155;
      line-height: 1.4;
    }

    .hide {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Quiz Card -->
    <div id="quiz-card" class="card">
      <div class="header">
        <div class="title">Simplification Mock Test</div>
        <div id="timer" class="timer-badge">⏱ 15:00</div>
      </div>

      <div class="progress-info" id="progress-text">Question 1 of 15</div>
      <div class="progress-bar-container">
        <div class="progress-bar-fill" id="progress-bar"></div>
      </div>

      <div class="question-text" id="question-text">Loading question...</div>

      <div class="options-grid" id="options-container"></div>

      <button id="next-btn" class="btn btn-primary" disabled>Next Question</button>
    </div>

    <!-- Results Card -->
    <div id="results-card" class="card hide">
      <div class="results-header">
        <div class="results-title">Test Completed!</div>
        <p style="color: var(--text-muted); font-size: 0.95rem;">Here is your performance summary</p>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">Score</div>
          <div class="stat-val" id="score-val">0/15</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Accuracy</div>
          <div class="stat-val" id="accuracy-val">0%</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Time Taken</div>
          <div class="stat-val" id="time-val">00:00</div>
        </div>
      </div>

      <div class="review-heading">Answer Key & Explanations</div>
      <div class="review-list" id="review-container"></div>

      <button id="restart-btn" class="btn btn-primary">Restart Test</button>
      <a href="index.html" style="text-decoration: none;">
        <button class="btn btn-secondary">Back to Home</button>
      </a>
    </div>
  </div>

  <script>
    const questions = [
      {
        q: "Evaluate: 48 ÷ 12 of 2 + [32 ÷ {16 - (8 + 4)}]",
        options: ["8", "10", "12", "14"],
        answer: 1,
        explanation: "Using BODMAS: First 'of': 12 of 2 = 24. Then 48 ÷ 24 = 2. Inside brackets: 8 + 4 = 12, 16 - 12 = 4, 32 ÷ 4 = 8. Total = 2 + 8 = 10."
      },
      {
        q: "Find the value of: 3.5 × 3.5 + 2 × 3.5 × 1.5 + 1.5 × 1.5",
        options: ["20", "25", "30", "15"],
        answer: 1,
        explanation: "This follows the algebraic formula a² + 2ab + b² = (a + b)². Here a = 3.5 and b = 1.5 => (3.5 + 1.5)² = 5² = 25."
      },
      {
        q: "What is the value of: √(176 + √(2401))?",
        options: ["14", "15", "16", "17"],
        answer: 1,
        explanation: "√2401 = 49. Then √(176 + 49) = √225 = 15."
      },
      {
        q: "Evaluate: (0.73 × 0.73 × 0.73 + 0.27 × 0.27 × 0.27) / (0.73 × 0.73 - 0.73 × 0.27 + 0.27 × 0.27)",
        options: ["1", "0.46", "0.54", "0.197"],
        answer: 0,
        explanation: "Using identity (a³ + b³) / (a² - ab + b²) = (a + b). Here, 0.73 + 0.27 = 1."
      },
      {
        q: "Simplify: 4 1/2 + 3 1/6 - 2 1/3 = ?",
        options: ["5 1/3", "5 1/6", "5 1/2", "5 2/3"],
        answer: 0,
        explanation: "Whole numbers: 4 + 3 - 2 = 5. Fractions: 1/2 + 1/6 - 1/3 = (3 + 1 - 2)/6 = 2/6 = 1/3. Total = 5 1/3."
      },
      {
        q: "Find the value of 'x': 45% of 600 + x% of 400 = 430",
        options: ["30", "35", "40", "45"],
        answer: 2,
        explanation: "45% of 600 = 270. 270 + 4x = 430 => 4x = 160 => x = 40."
      },
      {
        q: "Evaluate: 75 ÷ 5 × 3 + (14 - 6) × 4 - 18",
        options: ["49", "59", "61", "73"],
        answer: 1,
        explanation: "75 ÷ 5 = 15. 15 × 3 = 45. (14 - 6) = 8; 8 × 4 = 32. Total = 45 + 32 - 18 = 77 - 18 = 59."
      },
      {
        q: "Simplify: (5.624)^3 - (1.624)^3 / [(5.624)^2 + 5.624 × 1.624 + (1.624)^2]",
        options: ["4", "7.248", "3.248", "1"],
        answer: 0,
        explanation: "Using identity (a³ - b³) / (a² + ab + b²) = (a - b). Here, 5.624 - 1.624 = 4."
      },
      {
        q: "Find the value of x: (2^x) × (4^3) ÷ (8^2) = 16",
        options: ["2", "3", "4", "5"],
        answer: 2,
        explanation: "Express in powers of 2: 2^x × 2^6 ÷ 2^6 = 2^4 => 2^x = 2^4 => x = 4."
      },
      {
        q: "Evaluate: 1 ÷ [1 + 1 ÷ {1 + 1 ÷ (1 + 1/2)}]",
        options: ["3/5", "5/8", "8/5", "2/3"],
        answer: 1,
        explanation: "1 + 1/2 = 3/2. 1 ÷ (3/2) = 2/3. 1 + 2/3 = 5/3. 1 ÷ (5/3) = 3/5. 1 + 3/5 = 8/5. Finally, 1 ÷ (8/5) = 5/8."
      },
      {
        q: "What is 25% of 480 + 35% of 600 - 15% of 800?",
        options: ["210", "220", "230", "240"],
        answer: 0,
        explanation: "25% of 480 = 120. 35% of 600 = 210. 15% of 800 = 120. Result = 120 + 210 - 120 = 210."
      },
      {
        q: "Solve: (6.5 × 6.5 - 3.5 × 3.5) / (6.5 - 3.5)",
        options: ["3", "10", "13", "7"],
        answer: 1,
        explanation: "Using a² - b² = (a - b)(a + b). The expression simplifies to a + b = 6.5 + 3.5 = 10."
      },
      {
        q: "Find the value of: 108 ÷ 36 of 1/3 + 2/5 × 3 3/4",
        options: ["8.5", "10.5", "9", "12"],
        answer: 1,
        explanation: "36 of 1/3 = 12. 108 ÷ 12 = 9. 2/5 × 15/4 = 3/2 = 1.5. Total = 9 + 1.5 = 10.5."
      },
      {
        q: "Evaluate: √(400) + √(0.04) + √(0.000004)",
        options: ["20.202", "20.22", "20.022", "22.202"],
        answer: 0,
        explanation: "√400 = 20, √0.04 = 0.2, √0.000004 = 0.002. Sum = 20 + 0.2 + 0.002 = 20.202."
      },
      {
        q: "Find x if: 140% of 80 + x = 250",
        options: ["138", "148", "128", "118"],
        answer: 0,
        explanation: "140% of 80 = 1.4 × 80 = 112. 112 + x = 250 => x = 250 - 112 = 138."
      }
    ];

    const TOTAL_TIME = 15 * 60;
    let timeLeft = TOTAL_TIME;
    let timerInterval = null;
    let currentIndex = 0;
    let userAnswers = new Array(questions.length).fill(null);

    const quizCard = document.getElementById("quiz-card");
    const resultsCard = document.getElementById("results-card");
    const timerDisplay = document.getElementById("timer");
    const progressText = document.getElementById("progress-text");
    const progressBar = document.getElementById("progress-bar");
    const questionText = document.getElementById("question-text");
    const optionsContainer = document.getElementById("options-container");
    const nextBtn = document.getElementById("next-btn");
    const restartBtn = document.getElementById("restart-btn");

    function startTimer() {
      timerInterval = setInterval(() => {
        timeLeft--;
        updateTimerDisplay();

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          submitQuiz();
        }
      }, 1000);
    }

    function updateTimerDisplay() {
      const minutes = Math.floor(timeLeft / 60);
      const seconds = timeLeft % 60;
      timerDisplay.textContent = `⏱ ${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      
      if (timeLeft <= 60) {
        timerDisplay.classList.add("timer-warning");
      } else {
        timerDisplay.classList.remove("timer-warning");
      }
    }

    function renderQuestion() {
      const q = questions[currentIndex];
      progressText.textContent = `Question ${currentIndex + 1} of ${questions.length}`;
      progressBar.style.width = `${((currentIndex + 1) / questions.length) * 100}%`;
      questionText.textContent = `${currentIndex + 1}. ${q.q}`;

      optionsContainer.innerHTML = "";
      const prefixes = ["A", "B", "C", "D"];

      q.options.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        if (userAnswers[currentIndex] === idx) {
          btn.classList.add("selected");
        }
        btn.innerHTML = `<span class="option-prefix">${prefixes[idx]}</span> <span>${opt}</span>`;
        btn.onclick = () => selectOption(idx);
        optionsContainer.appendChild(btn);
      });

      nextBtn.disabled = userAnswers[currentIndex] === null;
      nextBtn.textContent = currentIndex === questions.length - 1 ? "Submit Test" : "Next Question";
    }

    function selectOption(index) {
      userAnswers[currentIndex] = index;
      const buttons = optionsContainer.querySelectorAll(".option-btn");
      buttons.forEach((btn, idx) => {
        btn.classList.toggle("selected", idx === index);
      });
      nextBtn.disabled = false;
    }

    nextBtn.onclick = () => {
      if (currentIndex < questions.length - 1) {
        currentIndex++;
        renderQuestion();
      } else {
        submitQuiz();
      }
    };

    function submitQuiz() {
      clearInterval(timerInterval);
      quizCard.classList.add("hide");
      resultsCard.classList.remove("hide");

      const timeTakenSec = TOTAL_TIME - timeLeft;
      const takenMins = Math.floor(timeTakenSec / 60);
      const takenSecs = timeTakenSec % 60;

      let score = 0;
      userAnswers.forEach((ans, idx) => {
        if (ans === questions[idx].answer) score++;
      });

      const accuracy = Math.round((score / questions.length) * 100);

      document.getElementById("score-val").textContent = `${score}/${questions.length}`;
      document.getElementById("accuracy-val").textContent = `${accuracy}%`;
      document.getElementById("time-val").textContent = `${String(takenMins).padStart(2, '0')}:${String(takenSecs).padStart(2, '0')}`;

      renderReview();
    }

    function renderReview() {
      const reviewContainer = document.getElementById("review-container");
      reviewContainer.innerHTML = "";
      const prefixes = ["A", "B", "C", "D"];

      questions.forEach((q, idx) => {
        const userAnsIndex = userAnswers[idx];
        const isCorrect = userAnsIndex === q.answer;

        const item = document.createElement("div");
        item.className = `review-item ${isCorrect ? 'correct' : 'wrong'}`;

        const userAnsText = userAnsIndex !== null 
          ? `${prefixes[userAnsIndex]}. ${q.options[userAnsIndex]}` 
          : "Not Attempted";
        const correctAnsText = `${prefixes[q.answer]}. ${q.options[q.answer]}`;

        item.innerHTML = `
          <div class="review-q-text">Q${idx + 1}: ${q.q}</div>
          <div class="review-ans-row"><strong>Your Answer:</strong> <span style="color:${isCorrect ? 'var(--success)' : 'var(--danger)'}">${userAnsText}</span></div>
          <div class="review-ans-row"><strong>Correct Answer:</strong> <span style="color:var(--success)">${correctAnsText}</span></div>
          <div class="review-explanation"><strong>Explanation:</strong> ${q.explanation}</div>
        `;
        reviewContainer.appendChild(item);
      });
    }

    restartBtn.onclick = () => {
      currentIndex = 0;
      timeLeft = TOTAL_TIME;
      userAnswers = new Array(questions.length).fill(null);
      resultsCard.classList.add("hide");
      quizCard.classList.remove("hide");
      startTimer();
      renderQuestion();
    };

    startTimer();
    renderQuestion();
  </script>
</body>
</html>
