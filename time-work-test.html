<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Time & Work Mock Test - Exam Prep Hub</title>
  <style>
    :root {
      --primary: #1e40af;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --success: #16a34a;
      --success-bg: #f0fdf4;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 680px;
      margin: auto;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px;
      border: 1px solid var(--border);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 2px solid var(--border);
      padding-bottom: 14px;
    }

    .title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--primary);
    }

    .timer-badge {
      font-size: 0.95rem;
      font-weight: 700;
      background: #eff6ff;
      color: var(--primary);
      padding: 6px 14px;
      border-radius: 9999px;
      border: 1px solid #bfdbfe;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .timer-warning {
      background: var(--danger-bg);
      color: var(--danger);
      border-color: #fecaca;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    .progress-info {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background-color: var(--border);
      border-radius: 9999px;
      overflow: hidden;
      margin-bottom: 24px;
    }

    .progress-bar-fill {
      height: 100%;
      background-color: var(--primary);
      width: 0%;
      transition: width 0.3s ease;
    }

    .question-text {
      font-size: 1.15rem;
      font-weight: 600;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .option-btn {
      background: #ffffff;
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 1rem;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      transition: all 0.2s ease;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }

    .option-btn:hover {
      border-color: #93c5fd;
      background-color: #f0f7ff;
    }

    .option-btn.selected {
      border-color: var(--primary);
      background-color: #eff6ff;
      font-weight: 600;
    }

    .option-prefix {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #f1f5f9;
      font-size: 0.85rem;
      font-weight: 700;
      flex-shrink: 0;
      color: var(--text-muted);
    }

    .option-btn.selected .option-prefix {
      background: var(--primary);
      color: #ffffff;
    }

    .btn {
      width: 100%;
      padding: 14px 20px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-primary {
      background-color: var(--primary);
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      background-color: var(--primary-hover);
    }

    .btn-primary:disabled {
      background-color: #cbd5e1;
      cursor: not-allowed;
    }

    .btn-secondary {
      background-color: transparent;
      color: var(--primary);
      border: 2px solid var(--primary);
      margin-top: 10px;
    }

    .btn-secondary:hover {
      background-color: var(--bg);
    }

    .results-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .results-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 8px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      text-align: center;
    }

    .stat-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 4px;
    }

    .stat-val {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--text);
    }

    .review-heading {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }

    .review-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 24px;
    }

    .review-item {
      padding: 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .review-item.correct {
      background-color: var(--success-bg);
      border-color: #bbf7d0;
    }

    .review-item.wrong {
      background-color: var(--danger-bg);
      border-color: #fecaca;
    }

    .review-q-text {
      font-weight: 600;
      margin-bottom: 10px;
      font-size: 0.95rem;
    }

    .review-ans-row {
      font-size: 0.88rem;
      margin-bottom: 4px;
    }

    .review-explanation {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed rgba(0, 0, 0, 0.1);
      font-size: 0.85rem;
      color: #334155;
      line-height: 1.4;
    }

    .hide {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Quiz Card -->
    <div id="quiz-card" class="card">
      <div class="header">
        <div class="title">Time & Work Mock Test</div>
        <div id="timer" class="timer-badge">⏱ 15:00</div>
      </div>

      <div class="progress-info" id="progress-text">Question 1 of 15</div>
      <div class="progress-bar-container">
        <div class="progress-bar-fill" id="progress-bar"></div>
      </div>

      <div class="question-text" id="question-text">Loading question...</div>

      <div class="options-grid" id="options-container"></div>

      <button id="next-btn" class="btn btn-primary" disabled>Next Question</button>
    </div>

    <!-- Results Card -->
    <div id="results-card" class="card hide">
      <div class="results-header">
        <div class="results-title">Test Completed!</div>
        <p style="color: var(--text-muted); font-size: 0.95rem;">Here is your performance summary</p>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">Score</div>
          <div class="stat-val" id="score-val">0/15</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Accuracy</div>
          <div class="stat-val" id="accuracy-val">0%</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Time Taken</div>
          <div class="stat-val" id="time-val">00:00</div>
        </div>
      </div>

      <div class="review-heading">Answer Key & Explanations</div>
      <div class="review-list" id="review-container"></div>

      <button id="restart-btn" class="btn btn-primary">Restart Test</button>
      <a href="index.html" style="text-decoration: none;">
        <button class="btn btn-secondary">Back to Home</button>
      </a>
    </div>
  </div>

  <script>
    const questions = [
      {
        q: "A can do a piece of work in 12 days and B in 18 days. How many days will they take to complete the work working together?",
        options: ["7.2 days", "8 days", "6 days", "7.5 days"],
        answer: 0,
        explanation: "1-day work = (1/12) + (1/18) = (3 + 2)/36 = 5/36. Total days = 36/5 = 7.2 days."
      },
      {
        q: "A and B together can do a piece of work in 8 days. If A alone can do it in 12 days, how many days will B alone take to do the work?",
        options: ["20 days", "24 days", "16 days", "18 days"],
        answer: 1,
        explanation: "B's 1-day work = (1/8) - (1/12) = (3 - 2)/24 = 1/24. Thus, B takes 24 days."
      },
      {
        q: "A is twice as good a workman as B, and together they finish a piece of work in 14 days. In how many days can A alone finish the work?",
        options: ["21 days", "28 days", "35 days", "42 days"],
        answer: 0,
        explanation: "Ratio of efficiency A : B = 2 : 1. Total efficiency = 3 units/day. Total work = 14 × 3 = 42 units. A takes 42 / 2 = 21 days."
      },
      {
        q: "12 men can complete a work in 8 days. How many days will 16 men take to complete the same work?",
        options: ["5 days", "6 days", "7 days", "4 days"],
        answer: 1,
        explanation: "Using M1 × D1 = M2 × D2: 12 × 8 = 16 × D2 => D2 = 96 / 16 = 6 days."
      },
      {
        q: "A can do a piece of work in 10 days, B in 15 days, and C in 30 days. How many days will they take working together?",
        options: ["4 days", "5 days", "6 days", "8 days"],
        answer: 1,
        explanation: "Combined 1-day work = 1/10 + 1/15 + 1/30 = (3 + 2 + 1)/30 = 6/30 = 1/5. Total time = 5 days."
      },
      {
        q: "A can do a work in 20 days and B in 30 days. They work together for 5 days, and then A leaves. How many more days will B take to finish the remaining work?",
        options: ["18 days", "20 days", "22.5 days", "17.5 days"],
        answer: 2,
        explanation: "Combined 1-day work = 1/20 + 1/30 = 5/60 = 1/12. In 5 days, work done = 5/12. Remaining work = 7/12. Time taken by B = (7/12) / (1/30) = (7/12) × 30 = 17.5 days."
      },
      {
        q: "If 15 men working 8 hours a day can build a wall in 10 days, in how many days can 20 men working 6 hours a day build the same wall?",
        options: ["8 days", "10 days", "12 days", "15 days"],
        answer: 1,
        explanation: "Using (M1 × D1 × H1) = (M2 × D2 × H2): 15 × 10 × 8 = 20 × D2 × 6 => 1200 = 120 × D2 => D2 = 10 days."
      },
      {
        q: "A and B can complete a work in 15 days and 10 days respectively. They started the work together, but B left after 2 days. In how many total days was the whole work completed?",
        options: ["12 days", "10 days", "14 days", "8 days"],
        answer: 0,
        explanation: "2 days of (A + B) = 2 × (1/15 + 1/10) = 2 × (5/30) = 1/3. Remaining work = 2/3. Time for A = (2/3) / (1/15) = 10 days. Total days = 2 + 10 = 12 days."
      },
      {
        q: "A can finish a work in 18 days and B in 15 days. B worked for 10 days and left the job. In how many days can A alone finish the remaining work?",
        options: ["5 days", "6 days", "8 days", "4 days"],
        answer: 1,
        explanation: "B's 10 days work = 10 × (1/15) = 2/3. Remaining work = 1 - 2/3 = 1/3. Time for A = (1/3) / (1/18) = 6 days."
      },
      {
        q: "Pipe A can fill a tank in 20 hours and Pipe B in 30 hours. If both pipes are opened together, how much time will they take to fill the tank?",
        options: ["10 hours", "12 hours", "15 hours", "18 hours"],
        answer: 1,
        explanation: "Combined filling rate = 1/20 + 1/30 = (3 + 2)/60 = 5/60 = 1/12. Time = 12 hours."
      },
      {
        q: "A, B, and C can do a work in 20, 30, and 60 days respectively. In how many days can A do the work if he is assisted by B and C on every third day?",
        options: ["12 days", "15 days", "16 days", "18 days"],
        answer: 1,
        explanation: "Total work = 60 units. Efficiency: A = 3, B = 2, C = 1. Day 1: A = 3; Day 2: A = 3; Day 3: A+B+C = 6. Work done in 3-day cycle = 12 units. Cycles needed = 60 / 12 = 5 cycles = 5 × 3 = 15 days."
      },
      {
        q: "A is thrice as efficient as B and is therefore able to finish a piece of work in 60 days less than B. Find the time in which they can do it working together.",
        options: ["20 days", "22.5 days", "25 days", "30 days"],
        answer: 1,
        explanation: "Ratio of times = 1 : 3. Difference = 2 units = 60 days => 1 unit = 30 days. So A = 30 days, B = 90 days. Together = (30 × 90) / (30 + 90) = 2700 / 120 = 22.5 days."
      },
      {
        q: "4 men or 6 women can finish a piece of work in 16 days. In how many days can 2 men and 9 women finish the same work?",
        options: ["8 days", "10 days", "12 days", "14 days"],
        answer: 0,
        explanation: "4 Men = 6 Women => 1 Man = 1.5 Women. 2 Men + 9 Women = (2 × 1.5) + 9 = 12 Women. Since 6 Women take 16 days, 12 Women take (6 × 16) / 12 = 8 days."
      },
      {
        q: "A and B undertake to do a piece of work for ₹600. A alone can do it in 6 days while B alone can do it in 8 days. With the help of C, they finish it in 3 days. Find C's share.",
        options: ["₹75", "₹100", "₹125", "₹150"],
        answer: 0,
        explanation: "C's 1-day work = 1/3 - (1/6 + 1/8) = 1/3 - 7/24 = 1/24. Ratio of work done A:B:C = 1/6 : 1/8 : 1/24 = 4 : 3 : 1. C's share = (1/8) × 600 = ₹75."
      },
      {
        q: "A can do a work in 16 days and B in 12 days. If they work on alternate days starting with A, in how many days will the work be completed?",
        options: ["13.75 days", "13.33 days", "14 days", "12.5 days"],
        answer: 0,
        explanation: "Total work = 48 units. Efficiency: A = 3, B = 4. 2-day work = 7 units. In 6 pairs (12 days), work = 42 units. Day 13: A does 3 units (total 45). Remaining = 3 units done by B in 3/4 = 0.75 day. Total = 13.75 days."
      }
    ];

    const TOTAL_TIME = 15 * 60;
    let timeLeft = TOTAL_TIME;
    let timerInterval = null;
    let currentIndex = 0;
    let userAnswers = new Array(questions.length).fill(null);

    const quizCard = document.getElementById("quiz-card");
    const resultsCard = document.getElementById("results-card");
    const timerDisplay = document.getElementById("timer");
    const progressText = document.getElementById("progress-text");
    const progressBar = document.getElementById("progress-bar");
    const questionText = document.getElementById("question-text");
    const optionsContainer = document.getElementById("options-container");
    const nextBtn = document.getElementById("next-btn");
    const restartBtn = document.getElementById("restart-btn");

    function startTimer() {
      timerInterval = setInterval(() => {
        timeLeft--;
        updateTimerDisplay();

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          submitQuiz();
        }
      }, 1000);
    }

    function updateTimerDisplay() {
      const minutes = Math.floor(timeLeft / 60);
      const seconds = timeLeft % 60;
      timerDisplay.textContent = `⏱ ${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      
      if (timeLeft <= 60) {
        timerDisplay.classList.add("timer-warning");
      } else {
        timerDisplay.classList.remove("timer-warning");
      }
    }

    function renderQuestion() {
      const q = questions[currentIndex];
      progressText.textContent = `Question ${currentIndex + 1} of ${questions.length}`;
      progressBar.style.width = `${((currentIndex + 1) / questions.length) * 100}%`;
      questionText.textContent = `${currentIndex + 1}. ${q.q}`;

      optionsContainer.innerHTML = "";
      const prefixes = ["A", "B", "C", "D"];

      q.options.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        if (userAnswers[currentIndex] === idx) {
          btn.classList.add("selected");
        }
        btn.innerHTML = `<span class="option-prefix">${prefixes[idx]}</span> <span>${opt}</span>`;
        btn.onclick = () => selectOption(idx);
        optionsContainer.appendChild(btn);
      });

      nextBtn.disabled = userAnswers[currentIndex] === null;
      nextBtn.textContent = currentIndex === questions.length - 1 ? "Submit Test" : "Next Question";
    }

    function selectOption(index) {
      userAnswers[currentIndex] = index;
      const buttons = optionsContainer.querySelectorAll(".option-btn");
      buttons.forEach((btn, idx) => {
        btn.classList.toggle("selected", idx === index);
      });
      nextBtn.disabled = false;
    }

    nextBtn.onclick = () => {
      if (currentIndex < questions.length - 1) {
        currentIndex++;
        renderQuestion();
      } else {
        submitQuiz();
      }
    };

    function submitQuiz() {
      clearInterval(timerInterval);
      quizCard.classList.add("hide");
      resultsCard.classList.remove("hide");

      const timeTakenSec = TOTAL_TIME - timeLeft;
      const takenMins = Math.floor(timeTakenSec / 60);
      const takenSecs = timeTakenSec % 60;

      let score = 0;
      userAnswers.forEach((ans, idx) => {
        if (ans === questions[idx].answer) score++;
      });

      const accuracy = Math.round((score / questions.length) * 100);

      document.getElementById("score-val").textContent = `${score}/${questions.length}`;
      document.getElementById("accuracy-val").textContent = `${accuracy}%`;
      document.getElementById("time-val").textContent = `${String(takenMins).padStart(2, '0')}:${String(takenSecs).padStart(2, '0')}`;

      renderReview();
    }

    function renderReview() {
      const reviewContainer = document.getElementById("review-container");
      reviewContainer.innerHTML = "";
      const prefixes = ["A", "B", "C", "D"];

      questions.forEach((q, idx) => {
        const userAnsIndex = userAnswers[idx];
        const isCorrect = userAnsIndex === q.answer;

        const item = document.createElement("div");
        item.className = `review-item ${isCorrect ? 'correct' : 'wrong'}`;

        const userAnsText = userAnsIndex !== null 
          ? `${prefixes[userAnsIndex]}. ${q.options[userAnsIndex]}` 
          : "Not Attempted";
        const correctAnsText = `${prefixes[q.answer]}. ${q.options[q.answer]}`;

        item.innerHTML = `
          <div class="review-q-text">Q${idx + 1}: ${q.q}</div>
          <div class="review-ans-row"><strong>Your Answer:</strong> <span style="color:${isCorrect ? 'var(--success)' : 'var(--danger)'}">${userAnsText}</span></div>
          <div class="review-ans-row"><strong>Correct Answer:</strong> <span style="color:var(--success)">${correctAnsText}</span></div>
          <div class="review-explanation"><strong>Explanation:</strong> ${q.explanation}</div>
        `;
        reviewContainer.appendChild(item);
      });
    }

    restartBtn.onclick = () => {
      currentIndex = 0;
      timeLeft = TOTAL_TIME;
      userAnswers = new Array(questions.length).fill(null);
      resultsCard.classList.add("hide");
      quizCard.classList.remove("hide");
      startTimer();
      renderQuestion();
    };

    startTimer();
    renderQuestion();
  </script>
</body>
</html>
