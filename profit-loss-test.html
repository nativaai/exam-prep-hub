<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profit & Loss Mock Test - Exam Prep Hub</title>
  <style>
    :root {
      --primary: #1e40af;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --success: #16a34a;
      --success-bg: #f0fdf4;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 680px;
      margin: auto;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px;
      border: 1px solid var(--border);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 2px solid var(--border);
      padding-bottom: 14px;
    }

    .title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--primary);
    }

    .timer-badge {
      font-size: 0.95rem;
      font-weight: 700;
      background: #eff6ff;
      color: var(--primary);
      padding: 6px 14px;
      border-radius: 9999px;
      border: 1px solid #bfdbfe;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .timer-warning {
      background: var(--danger-bg);
      color: var(--danger);
      border-color: #fecaca;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    .progress-info {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background-color: var(--border);
      border-radius: 9999px;
      overflow: hidden;
      margin-bottom: 24px;
    }

    .progress-bar-fill {
      height: 100%;
      background-color: var(--primary);
      width: 0%;
      transition: width 0.3s ease;
    }

    .question-text {
      font-size: 1.15rem;
      font-weight: 600;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .option-btn {
      background: #ffffff;
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 1rem;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      transition: all 0.2s ease;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }

    .option-btn:hover {
      border-color: #93c5fd;
      background-color: #f0f7ff;
    }

    .option-btn.selected {
      border-color: var(--primary);
      background-color: #eff6ff;
      font-weight: 600;
    }

    .option-prefix {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #f1f5f9;
      font-size: 0.85rem;
      font-weight: 700;
      flex-shrink: 0;
      color: var(--text-muted);
    }

    .option-btn.selected .option-prefix {
      background: var(--primary);
      color: #ffffff;
    }

    .btn {
      width: 100%;
      padding: 14px 20px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-primary {
      background-color: var(--primary);
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      background-color: var(--primary-hover);
    }

    .btn-primary:disabled {
      background-color: #cbd5e1;
      cursor: not-allowed;
    }

    .btn-secondary {
      background-color: transparent;
      color: var(--primary);
      border: 2px solid var(--primary);
      margin-top: 10px;
    }

    .btn-secondary:hover {
      background-color: var(--bg);
    }

    .results-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .results-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 8px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      text-align: center;
    }

    .stat-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 4px;
    }

    .stat-val {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--text);
    }

    .review-heading {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }

    .review-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 24px;
    }

    .review-item {
      padding: 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .review-item.correct {
      background-color: var(--success-bg);
      border-color: #bbf7d0;
    }

    .review-item.wrong {
      background-color: var(--danger-bg);
      border-color: #fecaca;
    }

    .review-q-text {
      font-weight: 600;
      margin-bottom: 10px;
      font-size: 0.95rem;
    }

    .review-ans-row {
      font-size: 0.88rem;
      margin-bottom: 4px;
    }

    .review-explanation {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed rgba(0, 0, 0, 0.1);
      font-size: 0.85rem;
      color: #334155;
      line-height: 1.4;
    }

    .hide {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Quiz Card -->
    <div id="quiz-card" class="card">
      <div class="header">
        <div class="title">Profit & Loss Mock Test</div>
        <div id="timer" class="timer-badge">⏱ 15:00</div>
      </div>

      <div class="progress-info" id="progress-text">Question 1 of 15</div>
      <div class="progress-bar-container">
        <div class="progress-bar-fill" id="progress-bar"></div>
      </div>

      <div class="question-text" id="question-text">Loading question...</div>

      <div class="options-grid" id="options-container"></div>

      <button id="next-btn" class="btn btn-primary" disabled>Next Question</button>
    </div>

    <!-- Results Card -->
    <div id="results-card" class="card hide">
      <div class="results-header">
        <div class="results-title">Test Completed!</div>
        <p style="color: var(--text-muted); font-size: 0.95rem;">Here is your performance summary</p>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">Score</div>
          <div class="stat-val" id="score-val">0/15</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Accuracy</div>
          <div class="stat-val" id="accuracy-val">0%</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Time Taken</div>
          <div class="stat-val" id="time-val">00:00</div>
        </div>
      </div>

      <div class="review-heading">Answer Key & Explanations</div>
      <div class="review-list" id="review-container"></div>

      <button id="restart-btn" class="btn btn-primary">Restart Test</button>
      <a href="index.html" style="text-decoration: none;">
        <button class="btn btn-secondary">Back to Home</button>
      </a>
    </div>
  </div>

  <script>
    const questions = [
      {
        q: "A person buys an article for ₹450 and sells it for ₹540. Find the profit percentage.",
        options: ["15%", "18%", "20%", "25%"],
        answer: 2,
        explanation: "Profit = ₹540 - ₹450 = ₹90. Profit % = (90 / 450) × 100 = 20%."
      },
      {
        q: "By selling an article for ₹720, a shopkeeper incurs a loss of 10%. At what price should he sell it to gain 20%?",
        options: ["₹840", "₹960", "₹900", "₹1,000"],
        answer: 1,
        explanation: "CP = 720 / 0.90 = ₹800. Required SP for 20% profit = 800 × 1.20 = ₹960."
      },
      {
        q: "If the cost price of 15 articles is equal to the selling price of 12 articles, find the gain percentage.",
        options: ["20%", "25%", "30%", "16.66%"],
        answer: 1,
        explanation: "15 CP = 12 SP => SP / CP = 15 / 12 = 5 / 4. Profit % = [(5 - 4) / 4] × 100 = 25%."
      },
      {
        q: "A man sells two articles for ₹1,200 each. On one he gains 20% and on the other he loses 20%. What is his overall gain or loss percentage?",
        options: ["No profit, no loss", "2% loss", "4% loss", "4% gain"],
        answer: 2,
        explanation: "When two items are sold at the same price with x% gain and x% loss, net loss % = (x / 10)² % = (20 / 10)² % = 4% loss."
      },
      {
        q: "A dishonest dealer professes to sell his goods at cost price, but uses a weight of 900 grams for a 1 kg weight. Find his real gain percentage.",
        options: ["10%", "11.11%", "9.09%", "12.5%"],
        answer: 1,
        explanation: "Gain % = [Error / (True Value - Error)] × 100 = (100 / 900) × 100 = 11.11% (or 11 1/9%)."
      },
      {
        q: "A shopkeeper marks his goods 40% above the cost price and allows a discount of 25% on the marked price. Find his net profit percentage.",
        options: ["5%", "10%", "15%", "8%"],
        answer: 0,
        explanation: "Let CP = 100. MP = 140. SP = 140 × (1 - 0.25) = 140 × 0.75 = 105. Profit % = 105 - 100 = 5%."
      },
      {
        q: "By selling 33 meters of cloth, a merchant gains the cost price of 11 meters. Find the profit percentage.",
        options: ["25%", "33.33%", "50%", "20%"],
        answer: 1,
        explanation: "Profit = 11 CP on 33 CP. Profit % = (11 / 33) × 100 = 33.33%."
      },
      {
        q: "If the difference between selling an article at a 5% loss and a 7% profit is ₹96, find the cost price of the article.",
        options: ["₹800", "₹750", "₹900", "₹850"],
        answer: 0,
        explanation: "Total % difference = 7% - (-5%) = 12%. Since 12% of CP = ₹96, CP = (96 / 12) × 100 = ₹800."
      },
      {
        q: "A trader buys two horses for ₹19,500. He sells one at a 20% loss and the other at a 15% profit. If the selling price of each horse is the same, find the cost price of the horse sold at a loss.",
        options: ["₹10,500", "₹11,500", "₹8,000", "₹11,000"],
        answer: 1,
        explanation: "0.80 × CP1 = 1.15 × CP2 => CP1 / CP2 = 115 / 80 = 23 / 16. Total parts = 39. CP1 = (23 / 39) × 19500 = ₹11,500."
      },
      {
        q: "A shopkeeper sells an item at 10% profit. If he had bought it at 10% less and sold it for ₹10 more, he would have gained 25%. What is the cost price?",
        options: ["₹350", "₹400", "₹450", "₹500"],
        answer: 1,
        explanation: "Let CP = 100x => SP1 = 110x. New CP = 90x => New SP = 90x × 1.25 = 112.5x. Difference = 112.5x - 110x = 2.5x = 10 => x = 4. CP = 100 × 4 = ₹400."
      },
      {
        q: "A fruit seller buys lemons at 2 for a rupee and sells them at 5 for ₹3. Find his profit percentage.",
        options: ["10%", "15%", "20%", "25%"],
        answer: 2,
        explanation: "CP per lemon = ₹1/2 = ₹0.50. SP per lemon = ₹3/5 = ₹0.60. Profit % = [(0.60 - 0.50) / 0.50] × 100 = 20%."
      },
      {
        q: "After allowing three successive discounts of 10%, 20%, and 25%, the net selling price is what percentage of the marked price?",
        options: ["46%", "54%", "45%", "55%"],
        answer: 1,
        explanation: "SP = MP × 0.90 × 0.80 × 0.75 = MP × 0.54 = 54% of MP."
      },
      {
        q: "By selling 45 toffees for ₹40, a man loses 20%. How many toffees should he sell for ₹24 to gain 20% in the transaction?",
        options: ["16", "18", "20", "24"],
        answer: 1,
        explanation: "SP of 1 toffee = 40/45 = 8/9. CP = (8/9) / 0.80 = 10/9. Required SP of 1 toffee = (10/9) × 1.20 = 4/3 = ₹1.33. Number of toffees for ₹24 = 24 / (4/3) = 18."
      },
      {
        q: "The marked price of a watch is ₹1,600. After two successive discounts, it is sold for ₹1,224. If the first discount is 10%, what is the rate of the second discount?",
        options: ["12%", "14%", "15%", "18%"],
        answer: 2,
        explanation: "Price after 1st discount = 1600 × 0.90 = ₹1,440. Second discount amount = 1440 - 1224 = ₹216. Rate of 2nd discount = (216 / 1440) × 100 = 15%."
      },
      {
        q: "A manufacturer earns a profit of 10%, the wholesale dealer 15%, and the retailer 25%. If the customer pays ₹1,265 for the article, find the cost of production for the manufacturer.",
        options: ["₹800", "₹850", "₹900", "₹950"],
        answer: 0,
        explanation: "CP × 1.10 × 1.15 × 1.25 = 1265 => CP × 1.58125 = 1265 => CP = 1265 / 1.58125 = ₹800."
      }
    ];

    const TOTAL_TIME = 15 * 60;
    let timeLeft = TOTAL_TIME;
    let timerInterval = null;
    let currentIndex = 0;
    let userAnswers = new Array(questions.length).fill(null);

    const quizCard = document.getElementById("quiz-card");
    const resultsCard = document.getElementById("results-card");
    const timerDisplay = document.getElementById("timer");
    const progressText = document.getElementById("progress-text");
    const progressBar = document.getElementById("progress-bar");
    const questionText = document.getElementById("question-text");
    const optionsContainer = document.getElementById("options-container");
    const nextBtn = document.getElementById("next-btn");
    const restartBtn = document.getElementById("restart-btn");

    function startTimer() {
      timerInterval = setInterval(() => {
        timeLeft--;
        updateTimerDisplay();

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          submitQuiz();
        }
      }, 1000);
    }

    function updateTimerDisplay() {
      const minutes = Math.floor(timeLeft / 60);
      const seconds = timeLeft % 60;
      timerDisplay.textContent = `⏱ ${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      
      if (timeLeft <= 60) {
        timerDisplay.classList.add("timer-warning");
      } else {
        timerDisplay.classList.remove("timer-warning");
      }
    }

    function renderQuestion() {
      const q = questions[currentIndex];
      progressText.textContent = `Question ${currentIndex + 1} of ${questions.length}`;
      progressBar.style.width = `${((currentIndex + 1) / questions.length) * 100}%`;
      questionText.textContent = `${currentIndex + 1}. ${q.q}`;

      optionsContainer.innerHTML = "";
      const prefixes = ["A", "B", "C", "D"];

      q.options.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        if (userAnswers[currentIndex] === idx) {
          btn.classList.add("selected");
        }
        btn.innerHTML = `<span class="option-prefix">${prefixes[idx]}</span> <span>${opt}</span>`;
        btn.onclick = () => selectOption(idx);
        optionsContainer.appendChild(btn);
      });

      nextBtn.disabled = userAnswers[currentIndex] === null;
      nextBtn.textContent = currentIndex === questions.length - 1 ? "Submit Test" : "Next Question";
    }

    function selectOption(index) {
      userAnswers[currentIndex] = index;
      const buttons = optionsContainer.querySelectorAll(".option-btn");
      buttons.forEach((btn, idx) => {
        btn.classList.toggle("selected", idx === index);
      });
      nextBtn.disabled = false;
    }

    nextBtn.onclick = () => {
      if (currentIndex < questions.length - 1) {
        currentIndex++;
        renderQuestion();
      } else {
        submitQuiz();
      }
    };

    function submitQuiz() {
      clearInterval(timerInterval);
      quizCard.classList.add("hide");
      resultsCard.classList.remove("hide");

      const timeTakenSec = TOTAL_TIME - timeLeft;
      const takenMins = Math.floor(timeTakenSec / 60);
      const takenSecs = timeTakenSec % 60;

      let score = 0;
      userAnswers.forEach((ans, idx) => {
        if (ans === questions[idx].answer) score++;
      });

      const accuracy = Math.round((score / questions.length) * 100);

      document.getElementById("score-val").textContent = `${score}/${questions.length}`;
      document.getElementById("accuracy-val").textContent = `${accuracy}%`;
      document.getElementById("time-val").textContent = `${String(takenMins).padStart(2, '0')}:${String(takenSecs).padStart(2, '0')}`;

      renderReview();
    }

    function renderReview() {
      const reviewContainer = document.getElementById("review-container");
      reviewContainer.innerHTML = "";
      const prefixes = ["A", "B", "C", "D"];

      questions.forEach((q, idx) => {
        const userAnsIndex = userAnswers[idx];
        const isCorrect = userAnsIndex === q.answer;

        const item = document.createElement("div");
        item.className = `review-item ${isCorrect ? 'correct' : 'wrong'}`;

        const userAnsText = userAnsIndex !== null 
          ? `${prefixes[userAnsIndex]}. ${q.options[userAnsIndex]}` 
          : "Not Attempted";
        const correctAnsText = `${prefixes[q.answer]}. ${q.options[q.answer]}`;

        item.innerHTML = `
          <div class="review-q-text">Q${idx + 1}: ${q.q}</div>
          <div class="review-ans-row"><strong>Your Answer:</strong> <span style="color:${isCorrect ? 'var(--success)' : 'var(--danger)'}">${userAnsText}</span></div>
          <div class="review-ans-row"><strong>Correct Answer:</strong> <span style="color:var(--success)">${correctAnsText}</span></div>
          <div class="review-explanation"><strong>Explanation:</strong> ${q.explanation}</div>
        `;
        reviewContainer.appendChild(item);
      });
    }

    restartBtn.onclick = () => {
      currentIndex = 0;
      timeLeft = TOTAL_TIME;
      userAnswers = new Array(questions.length).fill(null);
      resultsCard.classList.add("hide");
      quizCard.classList.remove("hide");
      startTimer();
      renderQuestion();
    };

    startTimer();
    renderQuestion();
  </script>
</body>
</html>
