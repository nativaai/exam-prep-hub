<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Current Affairs Mock Test - Exam Prep Hub</title>
  <style>
    :root {
      --primary: #1e40af;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --success: #16a34a;
      --success-bg: #f0fdf4;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 680px;
      margin: auto;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px;
      border: 1px solid var(--border);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 2px solid var(--border);
      padding-bottom: 14px;
    }

    .title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--primary);
    }

    .timer-badge {
      font-size: 0.95rem;
      font-weight: 700;
      background: #eff6ff;
      color: var(--primary);
      padding: 6px 14px;
      border-radius: 9999px;
      border: 1px solid #bfdbfe;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .timer-warning {
      background: var(--danger-bg);
      color: var(--danger);
      border-color: #fecaca;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    .progress-info {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background-color: var(--border);
      border-radius: 9999px;
      overflow: hidden;
      margin-bottom: 24px;
    }

    .progress-bar-fill {
      height: 100%;
      background-color: var(--primary);
      width: 0%;
      transition: width 0.3s ease;
    }

    .question-text {
      font-size: 1.05rem;
      font-weight: 600;
      line-height: 1.55;
      margin-bottom: 20px;
      white-space: pre-line;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .option-btn {
      background: #ffffff;
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 1rem;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      transition: all 0.2s ease;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }

    .option-btn:hover {
      border-color: #93c5fd;
      background-color: #f0f7ff;
    }

    .option-btn.selected {
      border-color: var(--primary);
      background-color: #eff6ff;
      font-weight: 600;
    }

    .option-prefix {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #f1f5f9;
      font-size: 0.85rem;
      font-weight: 700;
      flex-shrink: 0;
      color: var(--text-muted);
    }

    .option-btn.selected .option-prefix {
      background: var(--primary);
      color: #ffffff;
    }

    .btn {
      width: 100%;
      padding: 14px 20px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-primary {
      background-color: var(--primary);
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      background-color: var(--primary-hover);
    }

    .btn-primary:disabled {
      background-color: #cbd5e1;
      cursor: not-allowed;
    }

    .btn-secondary {
      background-color: transparent;
      color: var(--primary);
      border: 2px solid var(--primary);
      margin-top: 10px;
    }

    .btn-secondary:hover {
      background-color: var(--bg);
    }

    .results-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .results-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--primary);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      text-align: center;
    }

    .stat-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 4px;
    }

    .stat-val {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--text);
    }

    .review-heading {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }

    .review-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 24px;
    }

    .review-item {
      padding: 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .review-item.correct {
      background-color: var(--success-bg);
      border-color: #bbf7d0;
    }

    .review-item.wrong {
      background-color: var(--danger-bg);
      border-color: #fecaca;
    }

    .review-q-text {
      font-weight: 600;
      margin-bottom: 10px;
      font-size: 0.95rem;
      white-space: pre-line;
    }

    .review-ans-row {
      font-size: 0.88rem;
      margin-bottom: 4px;
    }

    .review-explanation {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed rgba(0, 0, 0, 0.1);
      font-size: 0.85rem;
      color: #334155;
      line-height: 1.4;
    }

    .hide {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="container">
    <div id="quiz-card" class="card">
      <div class="header">
        <div class="title">Current Affairs Mock Test</div>
        <div id="timer" class="timer-badge">⏱ 15:00</div>
      </div>

      <div class="progress-info" id="progress-text">Question 1 of 15</div>
      <div class="progress-bar-container">
        <div class="progress-bar-fill" id="progress-bar"></div>
      </div>

      <div class="question-text" id="question-text">Loading question...</div>

      <div class="options-grid" id="options-container"></div>

      <button id="next-btn" class="btn btn-primary" disabled>Next Question</button>
    </div>

    <div id="results-card" class="card hide">
      <div class="results-header">
        <div class="results-title">Test Completed!</div>
        <p style="color: var(--text-muted); font-size: 0.95rem;">Here is your performance summary</p>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">Score</div>
          <div class="stat-val" id="score-val">0/15</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Accuracy</div>
          <div class="stat-val" id="accuracy-val">0%</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Time Taken</div>
          <div class="stat-val" id="time-val">00:00</div>
        </div>
      </div>

      <div class="review-heading">Answer Key & Explanations</div>
      <div class="review-list" id="review-container"></div>

      <button id="restart-btn" class="btn btn-primary">Restart Test</button>
      <a href="index.html" style="text-decoration: none;">
        <button class="btn btn-secondary">Back to Home</button>
      </a>
    </div>
  </div>

  <script>
    const questions = [
      {
        q: "Which organization was awarded the Nobel Peace Prize 2024 for its efforts toward a world free of nuclear weapons?",
        options: ["Nihon Hidankyo", "World Food Programme", "International Atomic Energy Agency", "Memorial"],
        answer: 0,
        explanation: "Nihon Hidankyo, the Japanese grassroots movement of atomic bomb survivors from Hiroshima and Nagasaki (Hibakusha), won the 2024 Nobel Peace Prize."
      },
      {
        q: "Who became the first Indian athlete in independent India to win two medals at a single Olympic Games during Paris 2024?",
        options: ["Neeraj Chopra", "Manu Bhaker", "Swapnil Kusale", "Aman Sehrawat"],
        answer: 1,
        explanation: "Manu Bhaker won bronze medals in both the Women's 10m Air Pistol and the 10m Air Pistol Mixed Team event (with Sarabjot Singh) at the Paris 2024 Olympics."
      },
      {
        q: "India's solar observatory mission, Aditya-L1, was successfully placed into a halo orbit around which Lagrange Point?",
        options: ["L1", "L2", "L3", "L4"],
        answer: 0,
        explanation: "ISRO's Aditya-L1 was inserted into a halo orbit around the Sun-Earth Lagrange Point 1 (L1), roughly 1.5 million km from Earth."
      },
      {
        q: "Which country held the presidency of the G20 in 2024, hosting the G20 Leaders' Summit in Rio de Janeiro?",
        options: ["India", "Brazil", "South Africa", "Indonesia"],
        answer: 1,
        explanation: "Brazil held the G20 Presidency for 2024 (succeeding India's 2023 presidency and handing over to South Africa for 2025)."
      },
      {
        q: "Which Indian airport's Terminal 2 won the prestigious UNESCO Prix Versailles for 'World Special Prize for an Interior'?",
        options: ["Indira Gandhi International Airport, Delhi", "Kempegowda International Airport, Bengaluru", "Chhatrapati Shivaji Maharaj International Airport, Mumbai", "Rajiv Gandhi International Airport, Hyderabad"],
        answer: 1,
        explanation: "Kempegowda International Airport (BLR) Terminal 2 in Bengaluru was recognized at UNESCO's 2023/2024 Prix Versailles."
      },
      {
        q: "Which country officially hosted the COP29 UN Climate Change Conference in November 2024?",
        options: ["United Arab Emirates (Dubai)", "Azerbaijan (Baku)", "Egypt (Sharm El Sheikh)", "Brazil (Belem)"],
        answer: 1,
        explanation: "The 29th Conference of the Parties (COP29) to the UNFCCC was hosted in Baku, Azerbaijan in November 2024."
      },
      {
        q: "What is the official name of the landing point on the Moon where India's Chandrayaan-3 Vikram Lander touched down?",
        options: ["Tiranga Point", "Shiv Shakti Point", "Jawahar Point", "Atal Point"],
        answer: 1,
        explanation: "Prime Minister Narendra Modi named the Chandrayaan-3 lunar landing site near the lunar south pole as 'Shiv Shakti Point' (Chandrayaan-2 crash site was named 'Tiranga Point')."
      },
      {
        q: "Which country won the ICC Men's T20 World Cup 2024 held in the USA and West Indies?",
        options: ["South Africa", "Australia", "India", "England"],
        answer: 2,
        explanation: "India won the ICC Men's T20 World Cup 2024 by defeating South Africa by 7 runs in the final in Bridgetown, Barbados."
      },
      {
        q: "The 'Dadasaheb Phalke Award', India's highest award in cinema, was conferred on which veteran actor in 2024?",
        options: ["Mithun Chakraborty", "Waheeda Rehman", "Asha Parekh", "Rajinikanth"],
        answer: 0,
        explanation: "Veteran actor Mithun Chakraborty was honored with the Dadasaheb Phalke Award for the year 2022 (conferred at the 70th National Film Awards in 2024)."
      },
      {
        q: "Which multilateral grouping inducted Egypt, Ethiopia, Iran, and the United Arab Emirates as new official members in 2024?",
        options: ["BRICS", "SCO", "G7", "ASEAN"],
        answer: 0,
        explanation: "The BRICS alliance expanded in 2024 by admitting new member nations including Egypt, Ethiopia, Iran, and the UAE."
      },
      {
        q: "Who was appointed as the Chief Election Commissioner (CEC) of India following the retirement of Rajiv Kumar?",
        options: ["Gyanesh Kumar", "Sukhbir Singh Sandhu", "Rajiv Kumar", "Arun Goel"],
        answer: 0,
        explanation: "Gyanesh Kumar and Sukhbir Singh Sandhu were appointed as Election Commissioners under the new statutory appointment mechanism in 2024."
      },
      {
        q: "Which country became the 32nd member of the North Atlantic Treaty Organization (NATO) in March 2024?",
        options: ["Finland", "Sweden", "Ukraine", "Georgia"],
        answer: 1,
        explanation: "Sweden officially joined NATO as its 32nd member in March 2024 (Finland was the 31st member in 2023)."
      },
      {
        q: "Which Indian state launched the 'Kalaignar Magalir Urimai Thittam' basic income financial scheme for women?",
        options: ["Kerala", "Tamil Nadu", "Karnataka", "Andhra Pradesh"],
        answer: 1,
        explanation: "The Tamil Nadu government launched the monthly financial assistance scheme 'Kalaignar Magalir Urimai Thittam' providing ₹1,000 per month to eligible women heads of households."
      },
      {
        q: "Who won the Men's Singles title at the Wimbledon Championships 2024?",
        options: ["Novak Djokovic", "Carlos Alcaraz", "Jannik Sinner", "Daniil Medvedev"],
        answer: 1,
        explanation: "Carlos Alcaraz of Spain won the Wimbledon 2024 Men's Singles championship by defeating Novak Djokovic in straight sets."
      },
      {
        q: "The world's highest single-arch railway bridge, built over which river, was inaugurated in Jammu and Kashmir?",
        options: ["Jhelum", "Chenab", "Ravi", "Beas"],
        answer: 1,
        explanation: "The Chenab Rail Bridge, standing 359 meters above the Chenab riverbed (higher than the Eiffel Tower), connects the Kashmir valley to the rest of the Indian railway network."
      }
    ];

    const TOTAL_TIME = 15 * 60;
    let timeLeft = TOTAL_TIME;
    let timerInterval = null;
    let currentIndex = 0;
    let userAnswers = new Array(questions.length).fill(null);

    const quizCard = document.getElementById("quiz-card");
    const resultsCard = document.getElementById("results-card");
    const timerDisplay = document.getElementById("timer");
    const progressText = document.getElementById("progress-text");
    const progressBar = document.getElementById("progress-bar");
    const questionText = document.getElementById("question-text");
    const optionsContainer = document.getElementById("options-container");
    const nextBtn = document.getElementById("next-btn");
    const restartBtn = document.getElementById("restart-btn");

    function startTimer() {
      timerInterval = setInterval(() => {
        timeLeft--;
        updateTimerDisplay();

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          submitQuiz();
        }
      }, 1000);
    }

    function updateTimerDisplay() {
      const minutes = Math.floor(timeLeft / 60);
      const seconds = timeLeft % 60;
      timerDisplay.textContent = `⏱ ${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      
      if (timeLeft <= 60) {
        timerDisplay.classList.add("timer-warning");
      } else {
        timerDisplay.classList.remove("timer-warning");
      }
    }

    function renderQuestion() {
      const q = questions[currentIndex];
      progressText.textContent = `Question ${currentIndex + 1} of ${questions.length}`;
      progressBar.style.width = `${((currentIndex + 1) / questions.length) * 100}%`;
      questionText.textContent = `${currentIndex + 1}. ${q.q}`;

      optionsContainer.innerHTML = "";
      const prefixes = ["A", "B", "C", "D"];

      q.options.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        if (userAnswers[currentIndex] === idx) {
          btn.classList.add("selected");
        }
        btn.innerHTML = `<span class="option-prefix">${prefixes[idx]}</span> <span>${opt}</span>`;
        btn.onclick = () => selectOption(idx);
        optionsContainer.appendChild(btn);
      });

      nextBtn.disabled = userAnswers[currentIndex] === null;
      nextBtn.textContent = currentIndex === questions.length - 1 ? "Submit Test" : "Next Question";
    }

    function selectOption(index) {
      userAnswers[currentIndex] = index;
      const buttons = optionsContainer.querySelectorAll(".option-btn");
      buttons.forEach((btn, idx) => {
        btn.classList.toggle("selected", idx === index);
      });
      nextBtn.disabled = false;
    }

    nextBtn.onclick = () => {
      if (currentIndex < questions.length - 1) {
        currentIndex++;
        renderQuestion();
      } else {
        submitQuiz();
      }
    };

    function submitQuiz() {
      clearInterval(timerInterval);
      quizCard.classList.add("hide");
      resultsCard.classList.remove("hide");

      const timeTakenSec = TOTAL_TIME - timeLeft;
      const takenMins = Math.floor(timeTakenSec / 60);
      const takenSecs = timeTakenSec % 60;

      let score = 0;
      userAnswers.forEach((ans, idx) => {
        if (ans === questions[idx].answer) score++;
      });

      const accuracy = Math.round((score / questions.length) * 100);

      document.getElementById("score-val").textContent = `${score}/${questions.length}`;
      document.getElementById("accuracy-val").textContent = `${accuracy}%`;
      document.getElementById("time-val").textContent = `${String(takenMins).padStart(2, '0')}:${String(takenSecs).padStart(2, '0')}`;

      renderReview();
    }

    function renderReview() {
      const reviewContainer = document.getElementById("review-container");
      reviewContainer.innerHTML = "";
      const prefixes = ["A", "B", "C", "D"];

      questions.forEach((q, idx) => {
        const userAnsIndex = userAnswers[idx];
        const isCorrect = userAnsIndex === q.answer;

        const item = document.createElement("div");
        item.className = `review-item ${isCorrect ? 'correct' : 'wrong'}`;

        const userAnsText = userAnsIndex !== null 
          ? `${prefixes[userAnsIndex]}. ${q.options[userAnsIndex]}` 
          : "Not Attempted";
        const correctAnsText = `${prefixes[q.answer]}. ${q.options[q.answer]}`;

        item.innerHTML = `
          <div class="review-q-text">Q${idx + 1}: ${q.q}</div>
          <div class="review-ans-row"><strong>Your Answer:</strong> <span style="color:${isCorrect ? 'var(--success)' : 'var(--danger)'}">${userAnsText}</span></div>
          <div class="review-ans-row"><strong>Correct Answer:</strong> <span style="color:var(--success)">${correctAnsText}</span></div>
          <div class="review-explanation"><strong>Explanation:</strong> ${q.explanation}</div>
        `;
        reviewContainer.appendChild(item);
      });
    }

    restartBtn.onclick = () => {
      currentIndex = 0;
      timeLeft = TOTAL_TIME;
      userAnswers = new Array(questions.length).fill(null);
      resultsCard.classList.add("hide");
      quizCard.classList.remove("hide");
      startTimer();
      renderQuestion();
    };

    startTimer();
    renderQuestion();
  </script>
</body>
</html>
