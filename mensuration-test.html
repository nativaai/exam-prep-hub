<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mensuration Mock Test - Exam Prep Hub</title>
  <style>
    :root {
      --primary: #1e40af;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --success: #16a34a;
      --success-bg: #f0fdf4;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 680px;
      margin: auto;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px;
      border: 1px solid var(--border);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 2px solid var(--border);
      padding-bottom: 14px;
    }

    .title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--primary);
    }

    .timer-badge {
      font-size: 0.95rem;
      font-weight: 700;
      background: #eff6ff;
      color: var(--primary);
      padding: 6px 14px;
      border-radius: 9999px;
      border: 1px solid #bfdbfe;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .timer-warning {
      background: var(--danger-bg);
      color: var(--danger);
      border-color: #fecaca;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    .progress-info {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background-color: var(--border);
      border-radius: 9999px;
      overflow: hidden;
      margin-bottom: 24px;
    }

    .progress-bar-fill {
      height: 100%;
      background-color: var(--primary);
      width: 0%;
      transition: width 0.3s ease;
    }

    .question-text {
      font-size: 1.15rem;
      font-weight: 600;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .option-btn {
      background: #ffffff;
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 1rem;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      transition: all 0.2s ease;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }

    .option-btn:hover {
      border-color: #93c5fd;
      background-color: #f0f7ff;
    }

    .option-btn.selected {
      border-color: var(--primary);
      background-color: #eff6ff;
      font-weight: 600;
    }

    .option-prefix {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #f1f5f9;
      font-size: 0.85rem;
      font-weight: 700;
      flex-shrink: 0;
      color: var(--text-muted);
    }

    .option-btn.selected .option-prefix {
      background: var(--primary);
      color: #ffffff;
    }

    .btn {
      width: 100%;
      padding: 14px 20px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-primary {
      background-color: var(--primary);
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      background-color: var(--primary-hover);
    }

    .btn-primary:disabled {
      background-color: #cbd5e1;
      cursor: not-allowed;
    }

    .btn-secondary {
      background-color: transparent;
      color: var(--primary);
      border: 2px solid var(--primary);
      margin-top: 10px;
    }

    .btn-secondary:hover {
      background-color: var(--bg);
    }

    .results-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .results-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 8px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      text-align: center;
    }

    .stat-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 4px;
    }

    .stat-val {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--text);
    }

    .review-heading {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }

    .review-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 24px;
    }

    .review-item {
      padding: 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .review-item.correct {
      background-color: var(--success-bg);
      border-color: #bbf7d0;
    }

    .review-item.wrong {
      background-color: var(--danger-bg);
      border-color: #fecaca;
    }

    .review-q-text {
      font-weight: 600;
      margin-bottom: 10px;
      font-size: 0.95rem;
    }

    .review-ans-row {
      font-size: 0.88rem;
      margin-bottom: 4px;
    }

    .review-explanation {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed rgba(0, 0, 0, 0.1);
      font-size: 0.85rem;
      color: #334155;
      line-height: 1.4;
    }

    .hide {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Quiz Card -->
    <div id="quiz-card" class="card">
      <div class="header">
        <div class="title">Mensuration Mock Test</div>
        <div id="timer" class="timer-badge">⏱ 15:00</div>
      </div>

      <div class="progress-info" id="progress-text">Question 1 of 15</div>
      <div class="progress-bar-container">
        <div class="progress-bar-fill" id="progress-bar"></div>
      </div>

      <div class="question-text" id="question-text">Loading question...</div>

      <div class="options-grid" id="options-container"></div>

      <button id="next-btn" class="btn btn-primary" disabled>Next Question</button>
    </div>

    <!-- Results Card -->
    <div id="results-card" class="card hide">
      <div class="results-header">
        <div class="results-title">Test Completed!</div>
        <p style="color: var(--text-muted); font-size: 0.95rem;">Here is your performance summary</p>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">Score</div>
          <div class="stat-val" id="score-val">0/15</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Accuracy</div>
          <div class="stat-val" id="accuracy-val">0%</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Time Taken</div>
          <div class="stat-val" id="time-val">00:00</div>
        </div>
      </div>

      <div class="review-heading">Answer Key & Explanations</div>
      <div class="review-list" id="review-container"></div>

      <button id="restart-btn" class="btn btn-primary">Restart Test</button>
      <a href="index.html" style="text-decoration: none;">
        <button class="btn btn-secondary">Back to Home</button>
      </a>
    </div>
  </div>

  <script>
    const questions = [
      {
        q: "If the radius of a circle is decreased by 50%, find the percentage decrease in its area.",
        options: ["50%", "75%", "80%", "25%"],
        answer: 1,
        explanation: "Area is proportional to r². New area = (0.5r)² = 0.25 of original area. Decrease = 100% - 25% = 75%."
      },
      {
        q: "The length and breadth of a rectangle are in the ratio 4 : 3. If its area is 300 cm², what is its perimeter?",
        options: ["60 cm", "70 cm", "80 cm", "90 cm"],
        answer: 1,
        explanation: "Let sides be 4x and 3x. 4x × 3x = 12x² = 300 => x² = 25 => x = 5. Length = 20 cm, Breadth = 15 cm. Perimeter = 2(20 + 15) = 70 cm."
      },
      {
        q: "The diagonal of a square is 10√2 cm. What is the area of the square?",
        options: ["50 cm²", "100 cm²", "200 cm²", "150 cm²"],
        answer: 1,
        explanation: "Diagonal d = a√2 = 10√2 => side a = 10 cm. Area = a² = 10² = 100 cm²."
      },
      {
        q: "A metallic sphere of radius 6 cm is melted and recast into small spheres of radius 2 cm each. Find the total number of small spheres formed.",
        options: ["9", "18", "27", "36"],
        answer: 2,
        explanation: "Number of spheres = (Volume of big sphere) / (Volume of small sphere) = (R / r)³ = (6 / 2)³ = 3³ = 27."
      },
      {
        q: "Find the volume of a right circular cylinder whose radius is 7 cm and height is 10 cm (Take π = 22/7).",
        options: ["1440 cm³", "1540 cm³", "1640 cm³", "1580 cm³"],
        answer: 1,
        explanation: "Volume = πr²h = (22/7) × 7 × 7 × 10 = 22 × 7 × 10 = 1540 cm³."
      },
      {
        q: "The side of an equilateral triangle is 8 cm. What is its area?",
        options: ["16√3 cm²", "32√3 cm²", "24√3 cm²", "64√3 cm²"],
        answer: 0,
        explanation: "Area of equilateral triangle = (√3 / 4) × a² = (√3 / 4) × 64 = 16√3 cm²."
      },
      {
        q: "The radius of the base and the slant height of a cone are 7 cm and 25 cm respectively. Find the curved surface area of the cone (Take π = 22/7).",
        options: ["525 cm²", "550 cm²", "575 cm²", "600 cm²"],
        answer: 1,
        explanation: "Curved Surface Area = πrl = (22/7) × 7 × 25 = 22 × 25 = 550 cm²."
      },
      {
        q: "The total surface area of a cube is 150 cm². Find the length of its edge.",
        options: ["4 cm", "5 cm", "6 cm", "7 cm"],
        answer: 1,
        explanation: "Total Surface Area = 6a² = 150 => a² = 25 => a = 5 cm."
      },
      {
        q: "A hall is 15 m long, 10 m broad, and 4 m high. Find the total cost of painting its 4 walls at ₹5 per m².",
        options: ["₹900", "₹1,000", "₹1,100", "₹1,200"],
        answer: 1,
        explanation: "Area of 4 walls = 2h(l + b) = 2 × 4 × (15 + 10) = 8 × 25 = 200 m². Total Cost = 200 × ₹5 = ₹1,000."
      },
      {
        q: "The perimeter of a semi-circle is 36 cm. Find its diameter (Take π = 22/7).",
        options: ["7 cm", "14 cm", "21 cm", "28 cm"],
        answer: 1,
        explanation: "Perimeter = πr + 2r = r(22/7 + 2) = r(36/7) = 36 => r = 7 cm. Diameter = 2r = 14 cm."
      },
      {
        q: "The volume of a sphere is 38808 cm³. Find its radius (Take π = 22/7).",
        options: ["14 cm", "21 cm", "28 cm", "35 cm"],
        answer: 1,
        explanation: "(4/3)πr³ = 38808 => (4/3) × (22/7) × r³ = 38808 => r³ = (38808 × 21) / 88 = 441 × 21 = 9261 => r = 21 cm."
      },
      {
        q: "The diagonals of a rhombus are 16 cm and 12 cm. Find the perimeter of the rhombus.",
        options: ["32 cm", "40 cm", "48 cm", "52 cm"],
        answer: 1,
        explanation: "Diagonals bisect at right angles. Side a = √[(d1/2)² + (d2/2)²] = √[8² + 6²] = √100 = 10 cm. Perimeter = 4a = 40 cm."
      },
      {
        q: "If the length of a rectangular plot is increased by 20% and breadth is decreased by 10%, what is the net percentage change in area?",
        options: ["8% increase", "10% increase", "8% decrease", "12% increase"],
        answer: 0,
        explanation: "Net Change % = a + b + (ab/100) = 20 - 10 - (200/100) = 10 - 2 = +8% (8% increase)."
      },
      {
        q: "A wire when bent into the form of a square encloses an area of 121 cm². If the same wire is bent into the form of a circle, find the area of the circle (Take π = 22/7).",
        options: ["144 cm²", "154 cm²", "176 cm²", "184 cm²"],
        answer: 1,
        explanation: "Side of square = √121 = 11 cm. Wire length (perimeter) = 4 × 11 = 44 cm. Circumference of circle 2πr = 44 => r = 7 cm. Area = πr² = (22/7) × 49 = 154 cm²."
      },
      {
        q: "Find the length of the longest rod that can be placed in a room of dimensions 12 m × 9 m × 8 m.",
        options: ["15 m", "17 m", "19 m", "21 m"],
        answer: 1,
        explanation: "Longest rod = Diagonal of cuboid = √(l² + b² + h²) = √(12² + 9² + 8²) = √(144 + 81 + 64) = √289 = 17 m."
      }
    ];

    const TOTAL_TIME = 15 * 60;
    let timeLeft = TOTAL_TIME;
    let timerInterval = null;
    let currentIndex = 0;
    let userAnswers = new Array(questions.length).fill(null);

    const quizCard = document.getElementById("quiz-card");
    const resultsCard = document.getElementById("results-card");
    const timerDisplay = document.getElementById("timer");
    const progressText = document.getElementById("progress-text");
    const progressBar = document.getElementById("progress-bar");
    const questionText = document.getElementById("question-text");
    const optionsContainer = document.getElementById("options-container");
    const nextBtn = document.getElementById("next-btn");
    const restartBtn = document.getElementById("restart-btn");

    function startTimer() {
      timerInterval = setInterval(() => {
        timeLeft--;
        updateTimerDisplay();

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          submitQuiz();
        }
      }, 1000);
    }

    function updateTimerDisplay() {
      const minutes = Math.floor(timeLeft / 60);
      const seconds = timeLeft % 60;
      timerDisplay.textContent = `⏱ ${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      
      if (timeLeft <= 60) {
        timerDisplay.classList.add("timer-warning");
      } else {
        timerDisplay.classList.remove("timer-warning");
      }
    }

    function renderQuestion() {
      const q = questions[currentIndex];
      progressText.textContent = `Question ${currentIndex + 1} of ${questions.length}`;
      progressBar.style.width = `${((currentIndex + 1) / questions.length) * 100}%`;
      questionText.textContent = `${currentIndex + 1}. ${q.q}`;

      optionsContainer.innerHTML = "";
      const prefixes = ["A", "B", "C", "D"];

      q.options.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        if (userAnswers[currentIndex] === idx) {
          btn.classList.add("selected");
        }
        btn.innerHTML = `<span class="option-prefix">${prefixes[idx]}</span> <span>${opt}</span>`;
        btn.onclick = () => selectOption(idx);
        optionsContainer.appendChild(btn);
      });

      nextBtn.disabled = userAnswers[currentIndex] === null;
      nextBtn.textContent = currentIndex === questions.length - 1 ? "Submit Test" : "Next Question";
    }

    function selectOption(index) {
      userAnswers[currentIndex] = index;
      const buttons = optionsContainer.querySelectorAll(".option-btn");
      buttons.forEach((btn, idx) => {
        btn.classList.toggle("selected", idx === index);
      });
      nextBtn.disabled = false;
    }

    nextBtn.onclick = () => {
      if (currentIndex < questions.length - 1) {
        currentIndex++;
        renderQuestion();
      } else {
        submitQuiz();
      }
    };

    function submitQuiz() {
      clearInterval(timerInterval);
      quizCard.classList.add("hide");
      resultsCard.classList.remove("hide");

      const timeTakenSec = TOTAL_TIME - timeLeft;
      const takenMins = Math.floor(timeTakenSec / 60);
      const takenSecs = timeTakenSec % 60;

      let score = 0;
      userAnswers.forEach((ans, idx) => {
        if (ans === questions[idx].answer) score++;
      });

      const accuracy = Math.round((score / questions.length) * 100);

      document.getElementById("score-val").textContent = `${score}/${questions.length}`;
      document.getElementById("accuracy-val").textContent = `${accuracy}%`;
      document.getElementById("time-val").textContent = `${String(takenMins).padStart(2, '0')}:${String(takenSecs).padStart(2, '0')}`;

      renderReview();
    }

    function renderReview() {
      const reviewContainer = document.getElementById("review-container");
      reviewContainer.innerHTML = "";
      const prefixes = ["A", "B", "C", "D"];

      questions.forEach((q, idx) => {
        const userAnsIndex = userAnswers[idx];
        const isCorrect = userAnsIndex === q.answer;

        const item = document.createElement("div");
        item.className = `review-item ${isCorrect ? 'correct' : 'wrong'}`;

        const userAnsText = userAnsIndex !== null 
          ? `${prefixes[userAnsIndex]}. ${q.options[userAnsIndex]}` 
          : "Not Attempted";
        const correctAnsText = `${prefixes[q.answer]}. ${q.options[q.answer]}`;

        item.innerHTML = `
          <div class="review-q-text">Q${idx + 1}: ${q.q}</div>
          <div class="review-ans-row"><strong>Your Answer:</strong> <span style="color:${isCorrect ? 'var(--success)' : 'var(--danger)'}">${userAnsText}</span></div>
          <div class="review-ans-row"><strong>Correct Answer:</strong> <span style="color:var(--success)">${correctAnsText}</span></div>
          <div class="review-explanation"><strong>Explanation:</strong> ${q.explanation}</div>
        `;
        reviewContainer.appendChild(item);
      });
    }

    restartBtn.onclick = () => {
      currentIndex = 0;
      timeLeft = TOTAL_TIME;
      userAnswers = new Array(questions.length).fill(null);
      resultsCard.classList.add("hide");
      quizCard.classList.remove("hide");
      startTimer();
      renderQuestion();
    };

    startTimer();
    renderQuestion();
  </script>
</body>
</html>
