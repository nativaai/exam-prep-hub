<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seating Arrangement Mock Test - Exam Prep Hub</title>
  <style>
    :root {
      --primary: #1e40af;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --success: #16a34a;
      --success-bg: #f0fdf4;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 680px;
      margin: auto;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px;
      border: 1px solid var(--border);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 2px solid var(--border);
      padding-bottom: 14px;
    }

    .title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--primary);
    }

    .timer-badge {
      font-size: 0.95rem;
      font-weight: 700;
      background: #eff6ff;
      color: var(--primary);
      padding: 6px 14px;
      border-radius: 9999px;
      border: 1px solid #bfdbfe;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .timer-warning {
      background: var(--danger-bg);
      color: var(--danger);
      border-color: #fecaca;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    .progress-info {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background-color: var(--border);
      border-radius: 9999px;
      overflow: hidden;
      margin-bottom: 24px;
    }

    .progress-bar-fill {
      height: 100%;
      background-color: var(--primary);
      width: 0%;
      transition: width 0.3s ease;
    }

    .question-text {
      font-size: 1.08rem;
      font-weight: 600;
      line-height: 1.55;
      margin-bottom: 20px;
      white-space: pre-line;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .option-btn {
      background: #ffffff;
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 1rem;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      transition: all 0.2s ease;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }

    .option-btn:hover {
      border-color: #93c5fd;
      background-color: #f0f7ff;
    }

    .option-btn.selected {
      border-color: var(--primary);
      background-color: #eff6ff;
      font-weight: 600;
    }

    .option-prefix {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #f1f5f9;
      font-size: 0.85rem;
      font-weight: 700;
      flex-shrink: 0;
      color: var(--text-muted);
    }

    .option-btn.selected .option-prefix {
      background: var(--primary);
      color: #ffffff;
    }

    .btn {
      width: 100%;
      padding: 14px 20px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-primary {
      background-color: var(--primary);
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      background-color: var(--primary-hover);
    }

    .btn-primary:disabled {
      background-color: #cbd5e1;
      cursor: not-allowed;
    }

    .btn-secondary {
      background-color: transparent;
      color: var(--primary);
      border: 2px solid var(--primary);
      margin-top: 10px;
    }

    .btn-secondary:hover {
      background-color: var(--bg);
    }

    .results-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .results-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--primary);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      text-align: center;
    }

    .stat-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 4px;
    }

    .stat-val {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--text);
    }

    .review-heading {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }

    .review-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 24px;
    }

    .review-item {
      padding: 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .review-item.correct {
      background-color: var(--success-bg);
      border-color: #bbf7d0;
    }

    .review-item.wrong {
      background-color: var(--danger-bg);
      border-color: #fecaca;
    }

    .review-q-text {
      font-weight: 600;
      margin-bottom: 10px;
      font-size: 0.95rem;
      white-space: pre-line;
    }

    .review-ans-row {
      font-size: 0.88rem;
      margin-bottom: 4px;
    }

    .review-explanation {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed rgba(0, 0, 0, 0.1);
      font-size: 0.85rem;
      color: #334155;
      line-height: 1.4;
    }

    .hide {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Quiz Card -->
    <div id="quiz-card" class="card">
      <div class="header">
        <div class="title">Seating Arrangement Mock Test</div>
        <div id="timer" class="timer-badge">⏱ 15:00</div>
      </div>

      <div class="progress-info" id="progress-text">Question 1 of 15</div>
      <div class="progress-bar-container">
        <div class="progress-bar-fill" id="progress-bar"></div>
      </div>

      <div class="question-text" id="question-text">Loading question...</div>

      <div class="options-grid" id="options-container"></div>

      <button id="next-btn" class="btn btn-primary" disabled>Next Question</button>
    </div>

    <!-- Results Card -->
    <div id="results-card" class="card hide">
      <div class="results-header">
        <div class="results-title">Test Completed!</div>
        <p style="color: var(--text-muted); font-size: 0.95rem;">Here is your performance summary</p>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">Score</div>
          <div class="stat-val" id="score-val">0/15</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Accuracy</div>
          <div class="stat-val" id="accuracy-val">0%</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Time Taken</div>
          <div class="stat-val" id="time-val">00:00</div>
        </div>
      </div>

      <div class="review-heading">Answer Key & Explanations</div>
      <div class="review-list" id="review-container"></div>

      <button id="restart-btn" class="btn btn-primary">Restart Test</button>
      <a href="index.html" style="text-decoration: none;">
        <button class="btn btn-secondary">Back to Home</button>
      </a>
    </div>
  </div>

  <script>
    const questions = [
      {
        q: "Five friends A, B, C, D, and E are sitting in a row facing North.\n- C is sitting exactly in the middle.\n- A is sitting to the immediate right of C.\n- B is at one of the extreme ends and is not next to A.\n- D is to the immediate left of C.\nWho is sitting at the extreme right end?",
        options: ["A", "B", "E", "D"],
        answer: 2,
        explanation: "Arrangement from left to right: B - D - C - A - E. C is at index 3, D is at index 2, A is at index 4, B is at extreme left (1), and E is at extreme right (5)."
      },
      {
        q: "Six persons P, Q, R, S, T, and U are sitting in a circle facing the center.\n- P is second to the left of T.\n- S is second to the right of Q.\n- R is sitting between P and S.\n- U is sitting to the immediate left of T.\nWho is sitting opposite to P?",
        options: ["Q", "S", "T", "U"],
        answer: 0,
        explanation: "Clockwise arrangement: T - P - R - S - U - Q. P is opposite to Q."
      },
      {
        q: "Seven boys A, B, C, D, E, F, and G are standing in a line facing North.\n- D is to the immediate left of F.\n- C is to the immediate right of E.\n- A is to the immediate right of F.\n- G is between C and D.\n- E is at the extreme left end.\nWho is sitting in the exact middle?",
        options: ["C", "G", "D", "F"],
        answer: 1,
        explanation: "Arrangement from left to right: E - C - G - D - F - A - B. The 4th position (middle of 7) is occupied by G."
      },
      {
        q: "A, B, C, D, E, F, G, and H are sitting around a circular table facing the center.\n- A is third to the right of C and second to the left of E.\n- B is not an immediate neighbor of C or E.\n- D is second to the right of H, who is second to the right of C.\n- F is not an immediate neighbor of A.\nWho sits opposite to A?",
        options: ["H", "D", "G", "B"],
        answer: 1,
        explanation: "Clockwise from C: C - (gap) - H - A - D - E - (F/B/G). With 8 seats, D is sitting 4 places away from C (opposite C is E, opposite A is D)."
      },
      {
        q: "Five girls are sitting on a bench facing South.\n- Meena is to the left of Reena and to the right of Tina.\n- Priya is to the right of Reena.\n- Seema is between Reena and Priya.\nWho is sitting at the extreme right end (with respect to facing South)?",
        options: ["Tina", "Meena", "Reena", "Priya"],
        answer: 3,
        explanation: "Facing South: left is East (viewer's right) and right is West (viewer's left). From viewer's left to right: Priya - Seema - Reena - Meena - Tina. Priya is at the extreme right end of the persons."
      },
      {
        q: "Six friends A, B, C, D, E, and F are sitting around a hexagonal table facing the center.\n- A is opposite to D.\n- B is to the immediate right of A.\n- C is to the immediate left of D.\n- E is between A and C.\nWho is sitting between B and D?",
        options: ["E", "F", "C", "A"],
        answer: 1,
        explanation: "Clockwise order: A - B - F - D - C - E. The person between B and D is F."
      },
      {
        q: "In a classroom row of students facing North:\n- Suresh is 7th from the left and Ramesh is 12th from the right.\n- If they interchange their positions, Suresh becomes 22nd from the left.\nHow many total students are in the row?",
        options: ["31", "33", "34", "35"],
        answer: 1,
        explanation: "Ramesh's original position from the right is 12th. When Suresh takes this spot, he is 22nd from left. Total students = (22 + 12) - 1 = 33."
      },
      {
        q: "Eight friends J, K, L, M, N, O, P, and Q are sitting in a circle facing the center.\n- J is second to the left of P and third to the right of M.\n- K is to the immediate right of O, who is not adjacent to P.\n- L is third to the left of N.\nWho is sitting to the immediate left of J?",
        options: ["L", "M", "N", "Q"],
        answer: 2,
        explanation: "Placing positions around the 8-seat circle satisfying all constraints places N adjacent to J on J's immediate left."
      },
      {
        q: "Five people K, L, M, N, and O are standing in a queue for cinema tickets.\n- N is standing behind O and in front of K.\n- M is standing in front of O.\n- L is standing behind K.\nWho is first in the queue?",
        options: ["O", "N", "M", "L"],
        answer: 2,
        explanation: "From front to back: M -> O -> N -> K -> L. M is first in line."
      },
      {
        q: "Six executives A, B, C, D, E, and F sit around a circular conference table.\n- A is facing E.\n- F is to the immediate right of A.\n- B is between E and F.\n- D is to the immediate right of C.\nWho is to the immediate left of E?",
        options: ["D", "C", "B", "A"],
        answer: 0,
        explanation: "Facing center clockwise: A - F - B - E - D - C. The person to the immediate left of E (clockwise) is D."
      },
      {
        q: "Four boys A, B, C, D and four girls P, Q, R, S are sitting around a circular table facing center alternately (boy, girl, boy, girl).\n- A is sitting opposite to C.\n- P is sitting between A and B.\n- R is sitting to the immediate right of C.\nWho is sitting to the immediate left of A?",
        options: ["P", "Q", "S", "R"],
        answer: 2,
        explanation: "Since boys and girls alternate and P is between A and B (to A's right), the seat to A's left must be occupied by the remaining girl, S."
      },
      {
        q: "In a straight row of 40 children facing North:\n- Rohan is 11th from the right end.\n- There are 15 children between Rohan and Sahil.\nWhat is Sahil's position from the left end?",
        options: ["14th", "15th", "16th", "17th"],
        answer: 0,
        explanation: "Rohan is 11th from right. Sahil is 15 places to his left, so Sahil is 11 + 15 + 1 = 27th from right. Position from left = (40 - 27) + 1 = 14th."
      },
      {
        q: "Seven people P, Q, R, S, T, U, and V are sitting in a row facing North.\n- U is sitting to the immediate right of R.\n- P is sitting to the immediate left of T.\n- Q is at the extreme left end.\n- V is between Q and P.\n- S is at the extreme right end.\nWho is sitting to the immediate left of S?",
        options: ["U", "R", "T", "P"],
        answer: 0,
        explanation: "Left to right: Q - V - P - T - R - U - S. The person to the immediate left of S is U."
      },
      {
        q: "Six members of a family A, B, C, D, E, and F are sitting around a dining table.\n- B is sitting opposite to D.\n- E is sitting to the left of B.\n- C is sitting between A and D.\nWho is sitting opposite to E?",
        options: ["A", "C", "D", "F"],
        answer: 1,
        explanation: "In an even circular table of 6, clockwise arrangement is B - (F) - D - C - A - E. Opposite pairs: (B, D), (E, C), (F, A). C sits opposite to E."
      },
      {
        q: "Five cars 1, 2, 3, 4, and 5 are parked in a row facing North.\n- Car 4 is parked between Car 1 and Car 5.\n- Car 2 is to the immediate right of Car 5.\n- Car 3 is to the left of Car 1.\nWhich car is in the middle?",
        options: ["Car 1", "Car 4", "Car 5", "Car 3"],
        answer: 1,
        explanation: "Left to right: Car 3 - Car 1 - Car 4 - Car 5 - Car 2. Car 4 is in the middle (3rd position)."
      }
    ];

    const TOTAL_TIME = 15 * 60;
    let timeLeft = TOTAL_TIME;
    let timerInterval = null;
    let currentIndex = 0;
    let userAnswers = new Array(questions.length).fill(null);

    const quizCard = document.getElementById("quiz-card");
    const resultsCard = document.getElementById("results-card");
    const timerDisplay = document.getElementById("timer");
    const progressText = document.getElementById("progress-text");
    const progressBar = document.getElementById("progress-bar");
    const questionText = document.getElementById("question-text");
    const optionsContainer = document.getElementById("options-container");
    const nextBtn = document.getElementById("next-btn");
    const restartBtn = document.getElementById("restart-btn");

    function startTimer() {
      timerInterval = setInterval(() => {
        timeLeft--;
        updateTimerDisplay();

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          submitQuiz();
        }
      }, 1000);
    }

    function updateTimerDisplay() {
      const minutes = Math.floor(timeLeft / 60);
      const seconds = timeLeft % 60;
      timerDisplay.textContent = `⏱ ${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      
      if (timeLeft <= 60) {
        timerDisplay.classList.add("timer-warning");
      } else {
        timerDisplay.classList.remove("timer-warning");
      }
    }

    function renderQuestion() {
      const q = questions[currentIndex];
      progressText.textContent = `Question ${currentIndex + 1} of ${questions.length}`;
      progressBar.style.width = `${((currentIndex + 1) / questions.length) * 100}%`;
      questionText.textContent = `${currentIndex + 1}. ${q.q}`;

      optionsContainer.innerHTML = "";
      const prefixes = ["A", "B", "C", "D"];

      q.options.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        if (userAnswers[currentIndex] === idx) {
          btn.classList.add("selected");
        }
        btn.innerHTML = `<span class="option-prefix">${prefixes[idx]}</span> <span>${opt}</span>`;
        btn.onclick = () => selectOption(idx);
        optionsContainer.appendChild(btn);
      });

      nextBtn.disabled = userAnswers[currentIndex] === null;
      nextBtn.textContent = currentIndex === questions.length - 1 ? "Submit Test" : "Next Question";
    }

    function selectOption(index) {
      userAnswers[currentIndex] = index;
      const buttons = optionsContainer.querySelectorAll(".option-btn");
      buttons.forEach((btn, idx) => {
        btn.classList.toggle("selected", idx === index);
      });
      nextBtn.disabled = false;
    }

    nextBtn.onclick = () => {
      if (currentIndex < questions.length - 1) {
        currentIndex++;
        renderQuestion();
      } else {
        submitQuiz();
      }
    };

    function submitQuiz() {
      clearInterval(timerInterval);
      quizCard.classList.add("hide");
      resultsCard.classList.remove("hide");

      const timeTakenSec = TOTAL_TIME - timeLeft;
      const takenMins = Math.floor(timeTakenSec / 60);
      const takenSecs = timeTakenSec % 60;

      let score = 0;
      userAnswers.forEach((ans, idx) => {
        if (ans === questions[idx].answer) score++;
      });

      const accuracy = Math.round((score / questions.length) * 100);

      document.getElementById("score-val").textContent = `${score}/${questions.length}`;
      document.getElementById("accuracy-val").textContent = `${accuracy}%`;
      document.getElementById("time-val").textContent = `${String(takenMins).padStart(2, '0')}:${String(takenSecs).padStart(2, '0')}`;

      renderReview();
    }

    function renderReview() {
      const reviewContainer = document.getElementById("review-container");
      reviewContainer.innerHTML = "";
      const prefixes = ["A", "B", "C", "D"];

      questions.forEach((q, idx) => {
        const userAnsIndex = userAnswers[idx];
        const isCorrect = userAnsIndex === q.answer;

        const item = document.createElement("div");
        item.className = `review-item ${isCorrect ? 'correct' : 'wrong'}`;

        const userAnsText = userAnsIndex !== null 
          ? `${prefixes[userAnsIndex]}. ${q.options[userAnsIndex]}` 
          : "Not Attempted";
                const correctAnsText = `${prefixes[q.answer]}. ${q.options[q.answer]}`;

        item.innerHTML = `
          <div class="review-q-text">Q${idx + 1}: ${q.q}</div>
          <div class="review-ans-row"><strong>Your Answer:</strong> <span style="color:${isCorrect ? 'var(--success)' : 'var(--danger)'}">${userAnsText}</span></div>
          <div class="review-ans-row"><strong>Correct Answer:</strong> <span style="color:var(--success)">${correctAnsText}</span></div>
          <div class="review-explanation"><strong>Explanation:</strong> ${q.explanation}</div>
        `;
        reviewContainer.appendChild(item);
      });
    }

    restartBtn.onclick = () => {
      currentIndex = 0;
      timeLeft = TOTAL_TIME;
      userAnswers = new Array(questions.length).fill(null);
      resultsCard.classList.add("hide");
      quizCard.classList.remove("hide");
      startTimer();
      renderQuestion();
    };

    startTimer();
    renderQuestion();
  </script>
</body>
</html>
