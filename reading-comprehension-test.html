<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reading Comprehension Mock Test - Exam Prep Hub</title>
  <style>
    :root {
      --primary: #1e40af;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --success: #16a34a;
      --success-bg: #f0fdf4;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 680px;
      margin: auto;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px;
      border: 1px solid var(--border);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 2px solid var(--border);
      padding-bottom: 14px;
    }

    .title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--primary);
    }

    .timer-badge {
      font-size: 0.95rem;
      font-weight: 700;
      background: #eff6ff;
      color: var(--primary);
      padding: 6px 14px;
      border-radius: 9999px;
      border: 1px solid #bfdbfe;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .timer-warning {
      background: var(--danger-bg);
      color: var(--danger);
      border-color: #fecaca;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    .progress-info {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background-color: var(--border);
      border-radius: 9999px;
      overflow: hidden;
      margin-bottom: 24px;
    }

    .progress-bar-fill {
      height: 100%;
      background-color: var(--primary);
      width: 0%;
      transition: width 0.3s ease;
    }

    .passage-box {
      background-color: #f8fafc;
      border: 1px solid var(--border);
      border-left: 4px solid var(--primary);
      padding: 14px 16px;
      border-radius: 6px;
      font-size: 0.92rem;
      line-height: 1.6;
      color: #334155;
      margin-bottom: 18px;
      max-height: 200px;
      overflow-y: auto;
    }

    .passage-title {
      font-weight: 700;
      font-size: 0.85rem;
      color: var(--primary);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .question-text {
      font-size: 1.05rem;
      font-weight: 600;
      line-height: 1.5;
      margin-bottom: 18px;
      white-space: pre-line;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .option-btn {
      background: #ffffff;
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 0.98rem;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      transition: all 0.2s ease;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }

    .option-btn:hover {
      border-color: #93c5fd;
      background-color: #f0f7ff;
    }

    .option-btn.selected {
      border-color: var(--primary);
      background-color: #eff6ff;
      font-weight: 600;
    }

    .option-prefix {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #f1f5f9;
      font-size: 0.85rem;
      font-weight: 700;
      flex-shrink: 0;
      color: var(--text-muted);
    }

    .option-btn.selected .option-prefix {
      background: var(--primary);
      color: #ffffff;
    }

    .btn {
      width: 100%;
      padding: 14px 20px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-primary {
      background-color: var(--primary);
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      background-color: var(--primary-hover);
    }

    .btn-primary:disabled {
      background-color: #cbd5e1;
      cursor: not-allowed;
    }

    .btn-secondary {
      background-color: transparent;
      color: var(--primary);
      border: 2px solid var(--primary);
      margin-top: 10px;
    }

    .btn-secondary:hover {
      background-color: var(--bg);
    }

    .results-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .results-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--primary);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      text-align: center;
    }

    .stat-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 4px;
    }

    .stat-val {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--text);
    }

    .review-heading {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }

    .review-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 24px;
    }

    .review-item {
      padding: 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .review-item.correct {
      background-color: var(--success-bg);
      border-color: #bbf7d0;
    }

    .review-item.wrong {
      background-color: var(--danger-bg);
      border-color: #fecaca;
    }

    .review-q-text {
      font-weight: 600;
      margin-bottom: 10px;
      font-size: 0.95rem;
      white-space: pre-line;
    }

    .review-ans-row {
      font-size: 0.88rem;
      margin-bottom: 4px;
    }

    .review-explanation {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed rgba(0, 0, 0, 0.1);
      font-size: 0.85rem;
      color: #334155;
      line-height: 1.4;
    }

    .hide {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="container">
    <div id="quiz-card" class="card">
      <div class="header">
        <div class="title">Reading Comprehension Mock Test</div>
        <div id="timer" class="timer-badge">⏱ 15:00</div>
      </div>

      <div class="progress-info" id="progress-text">Question 1 of 15</div>
      <div class="progress-bar-container">
        <div class="progress-bar-fill" id="progress-bar"></div>
      </div>

      <div class="passage-box" id="passage-box">
        <div class="passage-title" id="passage-title">Passage</div>
        <div id="passage-text">Loading passage...</div>
      </div>

      <div class="question-text" id="question-text">Loading question...</div>

      <div class="options-grid" id="options-container"></div>

      <button id="next-btn" class="btn btn-primary" disabled>Next Question</button>
    </div>

    <div id="results-card" class="card hide">
      <div class="results-header">
        <div class="results-title">Test Completed!</div>
        <p style="color: var(--text-muted); font-size: 0.95rem;">Here is your performance summary</p>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">Score</div>
          <div class="stat-val" id="score-val">0/15</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Accuracy</div>
          <div class="stat-val" id="accuracy-val">0%</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Time Taken</div>
          <div class="stat-val" id="time-val">00:00</div>
        </div>
      </div>

      <div class="review-heading">Answer Key & Explanations</div>
      <div class="review-list" id="review-container"></div>

      <button id="restart-btn" class="btn btn-primary">Restart Test</button>
      <a href="index.html" style="text-decoration: none;">
        <button class="btn btn-secondary">Back to Home</button>
      </a>
    </div>
  </div>

  <script>
    const passages = [
      {
        id: 1,
        title: "Passage 1: Artificial Intelligence & Workforce",
        text: "The rapid integration of Artificial Intelligence (AI) across various industrial sectors has fundamentally transformed global labor dynamics. While proponents emphasize AI's capability to eradicate mundane, repetitive tasks and catalyze novel economic sectors, critics warn against widespread structural unemployment and socioeconomic inequality. Historically, technological revolutions have initially displaced labor before creating higher-value roles. However, the unprecedented velocity and breadth of modern cognitive automation challenge traditional reskilling timelines, necessitating dynamic policy frameworks and lifelong learning systems."
      },
      {
        id: 2,
        title: "Passage 2: Biodiversity & Climate Resilience",
        text: "Tropical rainforests and coral reefs represent ecological reservoirs that maintain Earth's climatic stability and biological diversity. Anthropogenic climate change, driven by extensive greenhouse emissions and aggressive deforestation, accelerates habitat degradation at an alarming rate. The loss of keystone species triggers cascading disruptions across ecological trophic webs, diminishing ecosystem resilience against extreme meteorological phenomena. Conservation efforts must transcend localized protectionism by embedding sustainable economic incentives directly into regional communities."
      },
      {
        id: 3,
        title: "Passage 3: The Evolution of Digital Financial Systems",
        text: "Digital public infrastructure and fintech innovations have democratized access to financial capital in developing economies. Central Bank Digital Currencies (CBDCs) and unified digital payments facilitate instantaneous, low-friction cross-border settlements while minimizing fiscal leakages in government welfare distributions. Nonetheless, this rapid transition exacerbates vulnerabilities regarding algorithmic bias, surveillance, and cyber warfare. Safeguarding system stability necessitates robust cryptographic security harmonized with international regulatory interoperability."
      }
    ];

    const questions = [
      // Passage 1 Questions (1 - 5)
      {
        passageId: 1,
        q: "According to Passage 1, what differentiates modern AI integration from historical technological revolutions?",
        options: [
          "It exclusively eliminates manual factory labor",
          "Its unprecedented speed and wide cognitive scope outpace conventional reskilling",
          "It generates zero higher-value employment opportunities",
          "It relies exclusively on decentralized workforce structures"
        ],
        answer: 1,
        explanation: "The passage notes that the unprecedented velocity and breadth of modern cognitive automation challenge traditional reskilling timelines."
      },
      {
        passageId: 1,
        q: "What is the primary concern raised by critics of AI adoption in the passage?",
        options: [
          "Excessive government intervention in private tech firms",
          "Immediate collapse of global supply chains",
          "Structural unemployment and widening socioeconomic disparity",
          "Inability of AI models to handle repetitive administrative tasks"
        ],
        answer: 2,
        explanation: "Critics warn against widespread structural unemployment and socioeconomic inequality."
      },
      {
        passageId: 1,
        q: "The word 'MUNDANE' as used in Passage 1 is closest in meaning to:",
        options: ["Exotic", "Routine and ordinary", "Exceptional", "Intellectual"],
        answer: 1,
        explanation: "'Mundane' means lacking interest or excitement; dull, routine, or repetitive."
      },
      {
        passageId: 1,
        q: "Which measure is explicitly suggested in Passage 1 to address the rapid transformation in labor?",
        options: [
          "Banning automated machine learning platforms",
          "Dynamic policy frameworks and lifelong learning mechanisms",
          "Freezing all international venture capital funding",
          "Shifting the entire economy back to agrarian manufacturing"
        ],
        answer: 1,
        explanation: "The author advocates for 'dynamic policy frameworks and lifelong learning systems'."
      },
      {
        passageId: 1,
        q: "What is the overall tone of Passage 1 regarding Artificial Intelligence?",
        options: [
          "Purely dismissive and alarmist",
          "Unconditionally celebratory",
          "Balanced and analytical",
          "Sarcastic and indifferent"
        ],
        answer: 2,
        explanation: "The author evaluates both the productivity advantages and the disruption risks in a balanced, objective manner."
      },

      // Passage 2 Questions (6 - 10)
      {
        passageId: 2,
        q: "According to Passage 2, what primary role do tropical rainforests and coral reefs play?",
        options: [
          "Serving as industrial timber hubs",
          "Regulating Earth's climatic stability and biological diversity",
          "Facilitating commercial maritime trade",
          "Preventing geological plate tectonic shifts"
        ],
        answer: 1,
        explanation: "The passage identifies them as ecological reservoirs that maintain Earth's climatic stability and biological diversity."
      },
      {
        passageId: 2,
        q: "What is identified as the core consequence of losing keystone species?",
        options: [
          "Immediate cessation of rainfall cycles worldwide",
          "Cascading disruptions throughout ecological trophic webs",
          "Lower oceanic surface temperatures",
          "Decreased atmospheric carbon concentrations"
        ],
        answer: 1,
        explanation: "The passage states that losing keystone species triggers cascading disruptions across ecological trophic webs."
      },
      {
        passageId: 2,
        q: "The word 'ANTHROPOGENIC' in Passage 2 most directly means:",
        options: ["Caused by human activity", "Ancient and prehistoric", "Naturally occurring", "Extraterrestrial in origin"],
        answer: 0,
        explanation: "'Anthropogenic' refers to environmental pollution or pollutants originating from human activity."
      },
      {
        passageId: 2,
        q: "How should conservation efforts evolve according to the author in Passage 2?",
        options: [
          "By completely cordoning off nature reserves from all human existence",
          "By integrating sustainable economic incentives directly into regional communities",
          "By relying solely on localized regional border controls",
          "By privatizing all global forested areas"
        ],
        answer: 1,
        explanation: "The author emphasizes embedding sustainable economic incentives directly into regional communities."
      },
      {
        passageId: 2,
        q: "Which title best summarizes Passage 2?",
        options: [
          "The Commercial Exploitation of Global Reefs",
          "Ecological Fragility, Climate Disruption, and Sustainable Conservation",
          "Meteorological Forecasting in Industrial Nations",
          "Deforestation: A History of Agriculture"
        ],
        answer: 1,
        explanation: "The passage discusses biodiversity loss, climate impacts, and community-integrated sustainable conservation."
      },

      // Passage 3 Questions (11 - 15)
      {
        passageId: 3,
        q: "According to Passage 3, how have digital payments and CBDCs improved public welfare distribution?",
        options: [
          "By eliminating all foreign trade tariffs",
          "By minimizing fiscal leakages through low-friction transactions",
          "By completely abolishing central regulatory banks",
          "By ensuring total anonymity for all taxable transfers"
        ],
        answer: 1,
        explanation: "The passage highlights that they minimize fiscal leakages in government welfare distributions."
      },
      {
        passageId: 3,
        q: "What major vulnerabilities of rapid digital financial transition are highlighted in Passage 3?",
        options: [
          "A decline in internet bandwidth access",
          "Algorithmic bias, surveillance, and cyber warfare risks",
          "Hyperinflation of traditional fiat currencies",
          "Complete cessation of international commerce"
        ],
        answer: 1,
        explanation: "The passage states that the rapid shift exacerbates vulnerabilities regarding algorithmic bias, surveillance, and cyber warfare."
      },
      {
        passageId: 3,
        q: "The word 'DEMOCRATIZED' in the context of Passage 3 means:",
        options: ["Restricted to elite institutions", "Made accessible to the wider population", "Subjected to political voting", "Monopolized by state agencies"],
        answer: 1,
        explanation: "In financial context, 'democratized access' means making financial tools broadly available to ordinary people."
      },
      {
        passageId: 3,
        q: "What is essential to safeguard financial system stability according to Passage 3?",
        options: [
          "Returning exclusively to physical cash economies",
          "Robust cryptographic security harmonized with global regulatory interoperability",
          "Unregulated decentralized token creation",
          "Total elimination of public digital infrastructure"
        ],
        answer: 1,
        explanation: "The author calls for robust cryptographic security combined with international regulatory interoperability."
      },
      {
        passageId: 3,
        q: "Which of the following inferences is most valid based on Passage 3?",
        options: [
          "Technological fintech efficiency must be balanced with cybersecurity and regulatory oversight",
          "Fintech innovations only benefit advanced developed economies",
          "Central Bank Digital Currencies are inherently impossible to secure",
          "Cross-border settlements will eventually be discontinued"
        ],
        answer: 0,
        explanation: "The passage contrasts the immense benefits of fintech democratization with the imperative for cybersecurity and regulatory coordination."
      }
    ];

    const TOTAL_TIME = 15 * 60;
    let timeLeft = TOTAL_TIME;
    let timerInterval = null;
    let currentIndex = 0;
    let userAnswers = new Array(questions.length).fill(null);

    const quizCard = document.getElementById("quiz-card");
    const resultsCard = document.getElementById("results-card");
    const timerDisplay = document.getElementById("timer");
    const progressText = document.getElementById("progress-text");
    const progressBar = document.getElementById("progress-bar");
        const passageTitle = document.getElementById("passage-title");
    const passageText = document.getElementById("passage-text");
    const questionText = document.getElementById("question-text");
    const optionsContainer = document.getElementById("options-container");
    const nextBtn = document.getElementById("next-btn");
    const restartBtn = document.getElementById("restart-btn");

    function startTimer() {
      timerInterval = setInterval(() => {
        timeLeft--;
        updateTimerDisplay();

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          submitQuiz();
        }
      }, 1000);
    }

    function updateTimerDisplay() {
      const minutes = Math.floor(timeLeft / 60);
      const seconds = timeLeft % 60;
      timerDisplay.textContent = `⏱ ${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      
      if (timeLeft <= 60) {
        timerDisplay.classList.add("timer-warning");
      } else {
        timerDisplay.classList.remove("timer-warning");
      }
    }

    function renderQuestion() {
      const q = questions[currentIndex];
      const curPassage = passages.find(p => p.id === q.passageId);

      progressText.textContent = `Question ${currentIndex + 1} of ${questions.length}`;
      progressBar.style.width = `${((currentIndex + 1) / questions.length) * 100}%`;

      passageTitle.textContent = curPassage.title;
      passageText.textContent = curPassage.text;
      questionText.textContent = `Q${currentIndex + 1}. ${q.q}`;

      optionsContainer.innerHTML = "";
      const prefixes = ["A", "B", "C", "D"];

      q.options.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        if (userAnswers[currentIndex] === idx) {
          btn.classList.add("selected");
        }
        btn.innerHTML = `<span class="option-prefix">${prefixes[idx]}</span> <span>${opt}</span>`;
        btn.onclick = () => selectOption(idx);
        optionsContainer.appendChild(btn);
      });

      nextBtn.disabled = userAnswers[currentIndex] === null;
      nextBtn.textContent = currentIndex === questions.length - 1 ? "Submit Test" : "Next Question";
    }

    function selectOption(index) {
      userAnswers[currentIndex] = index;
      const buttons = optionsContainer.querySelectorAll(".option-btn");
      buttons.forEach((btn, idx) => {
        btn.classList.toggle("selected", idx === index);
      });
      nextBtn.disabled = false;
    }

    nextBtn.onclick = () => {
      if (currentIndex < questions.length - 1) {
        currentIndex++;
        renderQuestion();
      } else {
        submitQuiz();
      }
    };

    function submitQuiz() {
      clearInterval(timerInterval);
      quizCard.classList.add("hide");
      resultsCard.classList.remove("hide");

      const timeTakenSec = TOTAL_TIME - timeLeft;
      const takenMins = Math.floor(timeTakenSec / 60);
      const takenSecs = timeTakenSec % 60;

      let score = 0;
      userAnswers.forEach((ans, idx) => {
        if (ans === questions[idx].answer) score++;
      });

      const accuracy = Math.round((score / questions.length) * 100);

      document.getElementById("score-val").textContent = `${score}/${questions.length}`;
      document.getElementById("accuracy-val").textContent = `${accuracy}%`;
      document.getElementById("time-val").textContent = `${String(takenMins).padStart(2, '0')}:${String(takenSecs).padStart(2, '0')}`;

      renderReview();
    }

    function renderReview() {
      const reviewContainer = document.getElementById("review-container");
      reviewContainer.innerHTML = "";
      const prefixes = ["A", "B", "C", "D"];

      questions.forEach((q, idx) => {
        const userAnsIndex = userAnswers[idx];
        const isCorrect = userAnsIndex === q.answer;

        const item = document.createElement("div");
        item.className = `review-item ${isCorrect ? 'correct' : 'wrong'}`;

        const userAnsText = userAnsIndex !== null 
          ? `${prefixes[userAnsIndex]}. ${q.options[userAnsIndex]}` 
          : "Not Attempted";
        const correctAnsText = `${prefixes[q.answer]}. ${q.options[q.answer]}`;

        item.innerHTML = `
          <div class="review-q-text">Q${idx + 1}: ${q.q}</div>
          <div class="review-ans-row"><strong>Your Answer:</strong> <span style="color:${isCorrect ? 'var(--success)' : 'var(--danger)'}">${userAnsText}</span></div>
          <div class="review-ans-row"><strong>Correct Answer:</strong> <span style="color:var(--success)">${correctAnsText}</span></div>
          <div class="review-explanation"><strong>Explanation:</strong> ${q.explanation}</div>
        `;
        reviewContainer.appendChild(item);
      });
    }

    restartBtn.onclick = () => {
      currentIndex = 0;
      timeLeft = TOTAL_TIME;
      userAnswers = new Array(questions.length).fill(null);
      resultsCard.classList.add("hide");
      quizCard.classList.remove("hide");
      startTimer();
      renderQuestion();
    };

    startTimer();
    renderQuestion();
  </script>
</body>
</html>
