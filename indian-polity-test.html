<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Indian Polity Mock Test - Exam Prep Hub</title>
  <style>
    :root {
      --primary: #1e40af;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --success: #16a34a;
      --success-bg: #f0fdf4;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 680px;
      margin: auto;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px;
      border: 1px solid var(--border);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 2px solid var(--border);
      padding-bottom: 14px;
    }

    .title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--primary);
    }

    .timer-badge {
      font-size: 0.95rem;
      font-weight: 700;
      background: #eff6ff;
      color: var(--primary);
      padding: 6px 14px;
      border-radius: 9999px;
      border: 1px solid #bfdbfe;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .timer-warning {
      background: var(--danger-bg);
      color: var(--danger);
      border-color: #fecaca;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    .progress-info {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background-color: var(--border);
      border-radius: 9999px;
      overflow: hidden;
      margin-bottom: 24px;
    }

    .progress-bar-fill {
      height: 100%;
      background-color: var(--primary);
      width: 0%;
      transition: width 0.3s ease;
    }

    .question-text {
      font-size: 1.05rem;
      font-weight: 600;
      line-height: 1.55;
      margin-bottom: 20px;
      white-space: pre-line;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .option-btn {
      background: #ffffff;
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 1rem;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      transition: all 0.2s ease;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }

    .option-btn:hover {
      border-color: #93c5fd;
      background-color: #f0f7ff;
    }

    .option-btn.selected {
      border-color: var(--primary);
      background-color: #eff6ff;
      font-weight: 600;
    }

    .option-prefix {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #f1f5f9;
      font-size: 0.85rem;
      font-weight: 700;
      flex-shrink: 0;
      color: var(--text-muted);
    }

    .option-btn.selected .option-prefix {
      background: var(--primary);
      color: #ffffff;
    }

    .btn {
      width: 100%;
      padding: 14px 20px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-primary {
      background-color: var(--primary);
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      background-color: var(--primary-hover);
    }

    .btn-primary:disabled {
      background-color: #cbd5e1;
      cursor: not-allowed;
    }

    .btn-secondary {
      background-color: transparent;
      color: var(--primary);
      border: 2px solid var(--primary);
      margin-top: 10px;
    }

    .btn-secondary:hover {
      background-color: var(--bg);
    }

    .results-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .results-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--primary);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      text-align: center;
    }

    .stat-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 4px;
    }

    .stat-val {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--text);
    }

    .review-heading {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }

    .review-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 24px;
    }

    .review-item {
      padding: 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .review-item.correct {
      background-color: var(--success-bg);
      border-color: #bbf7d0;
    }

    .review-item.wrong {
      background-color: var(--danger-bg);
      border-color: #fecaca;
    }

    .review-q-text {
      font-weight: 600;
      margin-bottom: 10px;
      font-size: 0.95rem;
      white-space: pre-line;
    }

    .review-ans-row {
      font-size: 0.88rem;
      margin-bottom: 4px;
    }

    .review-explanation {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed rgba(0, 0, 0, 0.1);
      font-size: 0.85rem;
      color: #334155;
      line-height: 1.4;
    }

    .hide {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="container">
    <div id="quiz-card" class="card">
      <div class="header">
        <div class="title">Indian Polity Mock Test</div>
        <div id="timer" class="timer-badge">⏱ 15:00</div>
      </div>

      <div class="progress-info" id="progress-text">Question 1 of 15</div>
      <div class="progress-bar-container">
        <div class="progress-bar-fill" id="progress-bar"></div>
      </div>

      <div class="question-text" id="question-text">Loading question...</div>

      <div class="options-grid" id="options-container"></div>

      <button id="next-btn" class="btn btn-primary" disabled>Next Question</button>
    </div>

    <div id="results-card" class="card hide">
      <div class="results-header">
        <div class="results-title">Test Completed!</div>
        <p style="color: var(--text-muted); font-size: 0.95rem;">Here is your performance summary</p>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">Score</div>
          <div class="stat-val" id="score-val">0/15</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Accuracy</div>
          <div class="stat-val" id="accuracy-val">0%</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Time Taken</div>
          <div class="stat-val" id="time-val">00:00</div>
        </div>
      </div>

      <div class="review-heading">Answer Key & Explanations</div>
      <div class="review-list" id="review-container"></div>

      <button id="restart-btn" class="btn btn-primary">Restart Test</button>
      <a href="index.html" style="text-decoration: none;">
        <button class="btn btn-secondary">Back to Home</button>
      </a>
    </div>
  </div>

  <script>
    const questions = [
      {
        q: "Which Article of the Indian Constitution was termed as the 'Heart and Soul of the Constitution' by Dr. B.R. Ambedkar?",
        options: ["Article 14", "Article 19", "Article 21", "Article 32"],
        answer: 3,
        explanation: "Article 32 guarantees the Right to Constitutional Remedies, allowing citizens to move the Supreme Court directly for enforcement of Fundamental Rights."
      },
      {
        q: "Who was the permanent President of the Constituent Assembly of India?",
        options: ["Dr. Sachchidananda Sinha", "Dr. B.R. Ambedkar", "Dr. Rajendra Prasad", "Jawaharlal Nehru"],
        answer: 2,
        explanation: "Dr. Rajendra Prasad was elected as the permanent President of the Constituent Assembly on December 11, 1946 (Dr. Sachchidananda Sinha was the temporary president)."
      },
      {
        q: "The Fundamental Duties were incorporated into Part IV-A of the Constitution on the recommendation of which committee?",
        options: ["Sarkaria Commission", "Swaran Singh Committee", "Balwant Rai Mehta Committee", "Verma Committee"],
        answer: 1,
        explanation: "The Swaran Singh Committee recommended the inclusion of Fundamental Duties, which were added by the 42nd Constitutional Amendment Act, 1976."
      },
      {
        q: "What is the minimum age required to become a member of the Rajya Sabha (Council of States)?",
        options: ["21 years", "25 years", "30 years", "35 years"],
        answer: 2,
        explanation: "According to Article 84 of the Constitution, the minimum age required to qualify for membership in the Rajya Sabha is 30 years (25 years for Lok Sabha)."
      },
      {
        q: "Which Constitutional Amendment Act introduced the 3-tier Panchayati Raj system in rural India?",
        options: ["42nd Amendment Act", "44th Amendment Act", "73rd Amendment Act", "74th Amendment Act"],
        answer: 2,
        explanation: "The 73rd Constitutional Amendment Act, 1992 added Part IX and the 11th Schedule, giving constitutional status to the Panchayati Raj Institutions."
      },
      {
        q: "The concept of 'Directive Principles of State Policy' (DPSP) in the Indian Constitution was borrowed from the constitution of which country?",
        options: ["USA", "Ireland", "United Kingdom", "USSR"],
        answer: 1,
        explanation: "Part IV of the Indian Constitution (Articles 36–51), containing the DPSPs, was borrowed from the Irish Constitution (which borrowed it from Spain)."
      },
      {
        q: "Under which Article can the President of India declare a Financial Emergency?",
        options: ["Article 352", "Article 356", "Article 360", "Article 368"],
        answer: 2,
        explanation: "Article 360 empowers the President to proclaim a Financial Emergency if the financial stability or credit of India is threatened."
      },
      {
        q: "Who acts as the ex-officio Chairman of the Rajya Sabha?",
        options: ["The President of India", "The Vice-President of India", "The Prime Minister", "The Speaker of Lok Sabha"],
        answer: 1,
        explanation: "Under Article 64, the Vice-President of India is the ex-officio Chairman of the Rajya Sabha."
      },
      {
        q: "Which writ is issued by the higher court to compel a public authority to perform a mandatory public duty?",
        options: ["Habeas Corpus", "Mandamus", "Quo-Warranto", "Certiorari"],
        answer: 1,
        explanation: "'Mandamus' literally means 'We Command' and is issued to enforce the performance of public duties by public officials or bodies."
      },
      {
        q: "The Comptroller and Auditor General of India (CAG) is appointed under which Article of the Constitution?",
        options: ["Article 76", "Article 148", "Article 280", "Article 324"],
        answer: 1,
        explanation: "Article 148 provides for the appointment of the Comptroller and Auditor General (CAG) of India by the President."
      },
      {
        q: "By which Constitutional Amendment was the voting age reduced from 21 years to 18 years?",
        options: ["44th Amendment Act", "61st Amendment Act", "73rd Amendment Act", "86th Amendment Act"],
        answer: 1,
        explanation: "The 61st Constitutional Amendment Act, 1988 (effective from 1989) amended Article 326 to lower the voting age from 21 to 18 years."
      },
      {
        q: "The Ninth Schedule was added to the Indian Constitution by which Constitutional Amendment?",
        options: ["1st Amendment Act (1951)", "7th Amendment Act (1956)", "24th Amendment Act (1971)", "42nd Amendment Act (1976)"],
        answer: 0,
        explanation: "The Ninth Schedule was added by the First Constitutional Amendment Act in 1951 to protect land reform laws from judicial review."
      },
      {
        q: "Who presides over a joint sitting of both Houses of Parliament?",
        options: ["President of India", "Chairman of Rajya Sabha", "Speaker of Lok Sabha", "Prime Minister"],
        answer: 2,
        explanation: "According to Article 118(4), a joint sitting of Parliament (summoned under Article 108 by the President) is presided over by the Speaker of the Lok Sabha."
      },
      {
        q: "Which constitutional body is constituted every 5 years by the President under Article 280 to recommend revenue distribution between the Union and States?",
        options: ["NITI Aayog", "Finance Commission", "GST Council", "Inter-State Council"],
        answer: 1,
        explanation: "The Finance Commission is constituted under Article 280 by the President to recommend tax distribution formulas between the Centre and States."
      },
      {
        q: "The Right to Education (RTE) was made a Fundamental Right under Article 21A by which Amendment Act?",
        options: ["44th Amendment Act", "86th Amendment Act", "91st Amendment Act", "97th Amendment Act"],
        answer: 1,
        explanation: "The 86th Constitutional Amendment Act, 2002 inserted Article 21A, providing free and compulsory education to children aged 6 to 14 years."
      }
    ];

    const TOTAL_TIME = 15 * 60;
    let timeLeft = TOTAL_TIME;
    let timerInterval = null;
    let currentIndex = 0;
    let userAnswers = new Array(questions.length).fill(null);

    const quizCard = document.getElementById("quiz-card");
    const resultsCard = document.getElementById("results-card");
    const timerDisplay = document.getElementById("timer");
    const progressText = document.getElementById("progress-text");
    const progressBar = document.getElementById("progress-bar");
    const questionText = document.getElementById("question-text");
    const optionsContainer = document.getElementById("options-container");
    const nextBtn = document.getElementById("next-btn");
    const restartBtn = document.getElementById("restart-btn");

    function startTimer() {
      timerInterval = setInterval(() => {
        timeLeft--;
        updateTimerDisplay();

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          submitQuiz();
        }
      }, 1000);
    }

    function updateTimerDisplay() {
      const minutes = Math.floor(timeLeft / 60);
      const seconds = timeLeft % 60;
      timerDisplay.textContent = `⏱ ${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      
      if (timeLeft <= 60) {
        timerDisplay.classList.add("timer-warning");
      } else {
        timerDisplay.classList.remove("timer-warning");
      }
    }

    function renderQuestion() {
      const q = questions[currentIndex];
      progressText.textContent = `Question ${currentIndex + 1} of ${questions.length}`;
      progressBar.style.width = `${((currentIndex + 1) / questions.length) * 100}%`;
      questionText.textContent = `${currentIndex + 1}. ${q.q}`;

      optionsContainer.innerHTML = "";
      const prefixes = ["A", "B", "C", "D"];

      q.options.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        if (userAnswers[currentIndex] === idx) {
          btn.classList.add("selected");
        }
        btn.innerHTML = `<span class="option-prefix">${prefixes[idx]}</span> <span>${opt}</span>`;
        btn.onclick = () => selectOption(idx);
        optionsContainer.appendChild(btn);
      });

      nextBtn.disabled = userAnswers[currentIndex] === null;
      nextBtn.textContent = currentIndex === questions.length - 1 ? "Submit Test" : "Next Question";
    }

    function selectOption(index) {
      userAnswers[currentIndex] = index;
      const buttons = optionsContainer.querySelectorAll(".option-btn");
      buttons.forEach((btn, idx) => {
        btn.classList.toggle("selected", idx === index);
      });
      nextBtn.disabled = false;
    }

    nextBtn.onclick = () => {
      if (currentIndex < questions.length - 1) {
        currentIndex++;
        renderQuestion();
      } else {
        submitQuiz();
      }
    };

    function submitQuiz() {
      clearInterval(timerInterval);
      quizCard.classList.add("hide");
      resultsCard.classList.remove("hide");

      const timeTakenSec = TOTAL_TIME - timeLeft;
      const takenMins = Math.floor(timeTakenSec / 60);
      const takenSecs = timeTakenSec % 60;

      let score = 0;
      userAnswers.forEach((ans, idx) => {
        if (ans === questions[idx].answer) score++;
      });

      const accuracy = Math.round((score / questions.length) * 100);

      document.getElementById("score-val").textContent = `${score}/${questions.length}`;
      document.getElementById("accuracy-val").textContent = `${accuracy}%`;
      document.getElementById("time-val").textContent = `${String(takenMins).padStart(2, '0')}:${String(takenSecs).padStart(2, '0')}`;

      renderReview();
    }

    function renderReview() {
      const reviewContainer = document.getElementById("review-container");
      reviewContainer.innerHTML = "";
      const prefixes = ["A", "B", "C", "D"];

      questions.forEach((q, idx) => {
        const userAnsIndex = userAnswers[idx];
        const isCorrect = userAnsIndex === q.answer;

        const item = document.createElement("div");
        item.className = `review-item ${isCorrect ? 'correct' : 'wrong'}`;

        const userAnsText = userAnsIndex !== null 
          ? `${prefixes[userAnsIndex]}. ${q.options[userAnsIndex]}` 
          : "Not Attempted";
        const correctAnsText = `${prefixes[q.answer]}. ${q.options[q.answer]}`;

        item.innerHTML = `
          <div class="review-q-text">Q${idx + 1}: ${q.q}</div>
          <div class="review-ans-row"><strong>Your Answer:</strong> <span style="color:${isCorrect ? 'var(--success)' : 'var(--danger)'}">${userAnsText}</span></div>
          <div class="review-ans-row"><strong>Correct Answer:</strong> <span style="color:var(--success)">${correctAnsText}</span></div>
          <div class="review-explanation"><strong>Explanation:</strong> ${q.explanation}</div>
        `;
        reviewContainer.appendChild(item);
      });
    }

    restartBtn.onclick = () => {
      currentIndex = 0;
      timeLeft = TOTAL_TIME;
      userAnswers = new Array(questions.length).fill(null);
      resultsCard.classList.add("hide");
      quizCard.classList.remove("hide");
      startTimer();
      renderQuestion();
    };

    startTimer();
    renderQuestion();
  </script>
</body>
</html>
