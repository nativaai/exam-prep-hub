<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sentence Correction Mock Test - Exam Prep Hub</title>
  <style>
    :root {
      --primary: #1e40af;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --success: #16a34a;
      --success-bg: #f0fdf4;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 680px;
      margin: auto;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px;
      border: 1px solid var(--border);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 2px solid var(--border);
      padding-bottom: 14px;
    }

    .title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--primary);
    }

    .timer-badge {
      font-size: 0.95rem;
      font-weight: 700;
      background: #eff6ff;
      color: var(--primary);
      padding: 6px 14px;
      border-radius: 9999px;
      border: 1px solid #bfdbfe;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .timer-warning {
      background: var(--danger-bg);
      color: var(--danger);
      border-color: #fecaca;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    .progress-info {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background-color: var(--border);
      border-radius: 9999px;
      overflow: hidden;
      margin-bottom: 24px;
    }

    .progress-bar-fill {
      height: 100%;
      background-color: var(--primary);
      width: 0%;
      transition: width 0.3s ease;
    }

    .question-text {
      font-size: 1.05rem;
      font-weight: 600;
      line-height: 1.55;
      margin-bottom: 20px;
      white-space: pre-line;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .option-btn {
      background: #ffffff;
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 1rem;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      transition: all 0.2s ease;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }

    .option-btn:hover {
      border-color: #93c5fd;
      background-color: #f0f7ff;
    }

    .option-btn.selected {
      border-color: var(--primary);
      background-color: #eff6ff;
      font-weight: 600;
    }

    .option-prefix {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #f1f5f9;
      font-size: 0.85rem;
      font-weight: 700;
      flex-shrink: 0;
      color: var(--text-muted);
    }

    .option-btn.selected .option-prefix {
      background: var(--primary);
      color: #ffffff;
    }

    .btn {
      width: 100%;
      padding: 14px 20px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-primary {
      background-color: var(--primary);
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      background-color: var(--primary-hover);
    }

    .btn-primary:disabled {
      background-color: #cbd5e1;
      cursor: not-allowed;
    }

    .btn-secondary {
      background-color: transparent;
      color: var(--primary);
      border: 2px solid var(--primary);
      margin-top: 10px;
    }

    .btn-secondary:hover {
      background-color: var(--bg);
    }

    .results-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .results-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--primary);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      text-align: center;
    }

    .stat-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 4px;
    }

    .stat-val {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--text);
    }

    .review-heading {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }

    .review-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 24px;
    }

    .review-item {
      padding: 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .review-item.correct {
      background-color: var(--success-bg);
      border-color: #bbf7d0;
    }

    .review-item.wrong {
      background-color: var(--danger-bg);
      border-color: #fecaca;
    }

    .review-q-text {
      font-weight: 600;
      margin-bottom: 10px;
      font-size: 0.95rem;
      white-space: pre-line;
    }

    .review-ans-row {
      font-size: 0.88rem;
      margin-bottom: 4px;
    }

    .review-explanation {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed rgba(0, 0, 0, 0.1);
      font-size: 0.85rem;
      color: #334155;
      line-height: 1.4;
    }

    .hide {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="container">
    <div id="quiz-card" class="card">
      <div class="header">
        <div class="title">Sentence Correction Mock Test</div>
        <div id="timer" class="timer-badge">⏱ 15:00</div>
      </div>

      <div class="progress-info" id="progress-text">Question 1 of 15</div>
      <div class="progress-bar-container">
        <div class="progress-bar-fill" id="progress-bar"></div>
      </div>

      <div class="question-text" id="question-text">Loading question...</div>

      <div class="options-grid" id="options-container"></div>

      <button id="next-btn" class="btn btn-primary" disabled>Next Question</button>
    </div>

    <div id="results-card" class="card hide">
      <div class="results-header">
        <div class="results-title">Test Completed!</div>
        <p style="color: var(--text-muted); font-size: 0.95rem;">Here is your performance summary</p>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">Score</div>
          <div class="stat-val" id="score-val">0/15</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Accuracy</div>
          <div class="stat-val" id="accuracy-val">0%</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Time Taken</div>
          <div class="stat-val" id="time-val">00:00</div>
        </div>
      </div>

      <div class="review-heading">Answer Key & Explanations</div>
      <div class="review-list" id="review-container"></div>

      <button id="restart-btn" class="btn btn-primary">Restart Test</button>
      <a href="index.html" style="text-decoration: none;">
        <button class="btn btn-secondary">Back to Home</button>
      </a>
    </div>
  </div>

  <script>
    const questions = [
      {
        q: "Improve the bracketed part of the sentence:\nHe did not know the answer, [and neither did I].",
        options: ["nor I did", "neither I knew", "and neither did I", "nor did I not"],
        answer: 2,
        explanation: "'Neither did I' uses correct subject-auxiliary inversion after a negative coordinator. The original sentence is already correct (No improvement needed)."
      },
      {
        q: "Improve the bracketed part:\nThe committee [is divided in their opinions] on the matter.",
        options: ["is divided in its opinion", "are divided in their opinions", "were divided in its opinion", "have divided in its opinion"],
        answer: 1,
        explanation: "When members of a collective noun (the committee) act separately or hold differing views, the noun takes a plural verb and plural pronoun: 'are divided in their opinions'."
      },
      {
        q: "Improve the bracketed part:\nIf I [had known] about the meeting, I would have attended it.",
        options: ["knew", "have known", "had known", "had been known"],
        answer: 2,
        explanation: "Third conditional structures take 'If + Past Perfect (had known), would have + Past Participle (would have attended)'. The sentence is correct as written."
      },
      {
        q: "Improve the bracketed part:\nHardly had we reached the platform [than the train arrived].",
        options: ["then the train arrived", "when the train arrived", "while the train arrived", "after the train arrived"],
        answer: 1,
        explanation: "'Hardly' and 'Scarcely' are paired with 'when' or 'before', not 'than'."
      },
      {
        q: "Improve the bracketed part:\nShe is [more intelligent than any student] in her class.",
        options: ["more intelligent than any other student", "most intelligent than any student", "as intelligent as any student", "more intelligent to any student"],
        answer: 0,
        explanation: "In comparative degree comparisons within the same group, 'any other' must be used to exclude the subject being compared from the rest of the group."
      },
      {
        q: "Improve the bracketed part:\nHe [insisted to go] to the market immediately.",
        options: ["insisted on going", "insisted for going", "insisted to going", "insisted on go"],
        answer: 0,
        explanation: "The verb 'insist' takes the preposition 'on' followed by a gerund (-ing form): 'insisted on going'."
      },
      {
        q: "Improve the bracketed part:\nThe climate of Shimla is [cooler than Delhi].",
        options: ["cooler than that of Delhi", "cooler to Delhi", "more cooler than Delhi", "cooler than those of Delhi"],
        answer: 0,
        explanation: "Comparisons must be logically parallel. We compare the climate of Shimla to the climate ('that') of Delhi, not directly to the city of Delhi."
      },
      {
        q: "Improve the bracketed part:\nIt is high time you [start working] on your project.",
        options: ["started working", "should start working", "have started working", "had started working"],
        answer: 0,
        explanation: "Phrases like 'It is time' or 'It is high time' followed by a subject take a simple past tense verb (subjunctive mood): 'started working'."
      },
      {
        q: "Improve the bracketed part:\nHe is looking forward [to meet] his old school friends.",
        options: ["to meeting", "for meeting", "to have met", "meeting"],
        answer: 0,
        explanation: "'Look forward to' is a phrasal verb where 'to' is a preposition, which must be followed by a gerund: 'to meeting'."
      },
      {
        q: "Improve the bracketed part:\nNot only he lost his wallet [but also his phone].",
        options: ["He lost not only his wallet but also his phone", "Not only lost he his wallet but also his phone", "He not only lost his wallet but his phone also", "He lost but also his wallet and phone"],
        answer: 0,
        explanation: "Correlative conjunctions ('not only... but also') must maintain parallel structure by joining two similar elements: 'not only [his wallet] but also [his phone]'."
      },
      {
        q: "Improve the bracketed part:\nThe higher you climb, [the coolest you feel].",
        options: ["the cooler you feel", "cooler you feel", "the most cool you feel", "the more cooler you feel"],
        answer: 0,
        explanation: "Parallel proportional increase structures require 'the + comparative degree... the + comparative degree': 'The higher you climb, the cooler you feel'."
      },
      {
        q: "Improve the bracketed part:\nHe prevented me [from entering] the restricted zone.",
        options: ["to enter", "for entering", "from entering", "against entering"],
        answer: 2,
        explanation: "'Prevent' takes the preposition 'from' followed by a gerund: 'prevented me from entering'. The sentence is correct as is."
      },
      {
        q: "Improve the bracketed part:\nI would rather starve [than to beg] on the street.",
        options: ["than beg", "then beg", "to beg than", "than begging"],
        answer: 0,
        explanation: "'Would rather' takes a bare infinitive (infinitive without 'to') after 'than': 'would rather starve than beg'."
      },
      {
        q: "Improve the bracketed part:\nShe [is living in this town since] 2010.",
        options: ["has been living in this town since", "was living in this town since", "lives in this town from", "is lived in this town since"],
        answer: 0,
        explanation: "Actions that started in the past and continue in the present with 'since' require Present Perfect Continuous tense: 'has been living'."
      },
      {
        q: "Improve the bracketed part:\nHe resembles [to his father] in both look and mannerism.",
        options: ["with his father", "his father", "after his father", "by his father"],
        answer: 1,
        explanation: "'Resemble' is a transitive verb and takes a direct object without any preposition: 'resembles his father'."
      }
    ];

    const TOTAL_TIME = 15 * 60;
    let timeLeft = TOTAL_TIME;
    let timerInterval = null;
    let currentIndex = 0;
    let userAnswers = new Array(questions.length).fill(null);

    const quizCard = document.getElementById("quiz-card");
    const resultsCard = document.getElementById("results-card");
    const timerDisplay = document.getElementById("timer");
    const progressText = document.getElementById("progress-text");
    const progressBar = document.getElementById("progress-bar");
    const questionText = document.getElementById("question-text");
    const optionsContainer = document.getElementById("options-container");
    const nextBtn = document.getElementById("next-btn");
    const restartBtn = document.getElementById("restart-btn");

    function startTimer() {
      timerInterval = setInterval(() => {
        timeLeft--;
        updateTimerDisplay();

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          submitQuiz();
        }
      }, 1000);
    }

    function updateTimerDisplay() {
      const minutes = Math.floor(timeLeft / 60);
      const seconds = timeLeft % 60;
      timerDisplay.textContent = `⏱ ${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      
      if (timeLeft <= 60) {
        timerDisplay.classList.add("timer-warning");
      } else {
        timerDisplay.classList.remove("timer-warning");
      }
    }

    function renderQuestion() {
      const q = questions[currentIndex];
      progressText.textContent = `Question ${currentIndex + 1} of ${questions.length}`;
      progressBar.style.width = `${((currentIndex + 1) / questions.length) * 100}%`;
      questionText.textContent = `${currentIndex + 1}. ${q.q}`;

      optionsContainer.innerHTML = "";
      const prefixes = ["A", "B", "C", "D"];

      q.options.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        if (userAnswers[currentIndex] === idx) {
          btn.classList.add("selected");
        }
        btn.innerHTML = `<span class="option-prefix">${prefixes[idx]}</span> <span>${opt}</span>`;
        btn.onclick = () => selectOption(idx);
        optionsContainer.appendChild(btn);
      });

      nextBtn.disabled = userAnswers[currentIndex] === null;
      nextBtn.textContent = currentIndex === questions.length - 1 ? "Submit Test" : "Next Question";
    }

    function selectOption(index) {
      userAnswers[currentIndex] = index;
      const buttons = optionsContainer.querySelectorAll(".option-btn");
      buttons.forEach((btn, idx) => {
        btn.classList.toggle("selected", idx === index);
      });
      nextBtn.disabled = false;
    }

    nextBtn.onclick = () => {
      if (currentIndex < questions.length - 1) {
        currentIndex++;
        renderQuestion();
      } else {
        submitQuiz();
      }
    };

    function submitQuiz() {
      clearInterval(timerInterval);
      quizCard.classList.add("hide");
      resultsCard.classList.remove("hide");

      const timeTakenSec = TOTAL_TIME - timeLeft;
      const takenMins = Math.floor(timeTakenSec / 60);
      const takenSecs = timeTakenSec % 60;

      let score = 0;
      userAnswers.forEach((ans, idx) => {
        if (ans === questions[idx].answer) score++;
      });

      const accuracy = Math.round((score / questions.length) * 100);

      document.getElementById("score-val").textContent = `${score}/${questions.length}`;
      document.getElementById("accuracy-val").textContent = `${accuracy}%`;
      document.getElementById("time-val").textContent = `${String(takenMins).padStart(2, '0')}:${String(takenSecs).padStart(2, '0')}`;

      renderReview();
    }

    function renderReview() {
      const reviewContainer = document.getElementById("review-container");
      reviewContainer.innerHTML = "";
      const prefixes = ["A", "B", "C", "D"];

      questions.forEach((q, idx) => {
        const userAnsIndex = userAnswers[idx];
        const isCorrect = userAnsIndex === q.answer;

        const item = document.createElement("div");
        item.className = `review-item ${isCorrect ? 'correct' : 'wrong'}`;

        const userAnsText = userAnsIndex !== null 
          ? `${prefixes[userAnsIndex]}. ${q.options[userAnsIndex]}` 
          : "Not Attempted";
        const correctAnsText = `${prefixes[q.answer]}. ${q.options[q.answer]}`;

        item.innerHTML = `
          <div class="review-q-text">Q${idx + 1}: ${q.q}</div>
          <div class="review-ans-row"><strong>Your Answer:</strong> <span style="color:${isCorrect ? 'var(--success)' : 'var(--danger)'}">${userAnsText}</span></div>
          <div class="review-ans-row"><strong>Correct Answer:</strong> <span style="color:var(--success)">${correctAnsText}</span></div>
          <div class="review-explanation"><strong>Explanation:</strong> ${q.explanation}</div>
        `;
        reviewContainer.appendChild(item);
      });
    }

    restartBtn.onclick = () => {
      currentIndex = 0;
      timeLeft = TOTAL_TIME;
      userAnswers = new Array(questions.length).fill(null);
      resultsCard.classList.add("hide");
      quizCard.classList.remove("hide");
      startTimer();
      renderQuestion();
    };

    startTimer();
    renderQuestion();
  </script>
</body>
</html>
